  PIN DOCENTE: CUALITATIVO2026 (lo pide solo dashboard_docente.html; este archivo no pide PIN)
  Estado compartido con el portal (localStorage, mismo origen): lee mis_bcs_reg y mis_bcs_theme; escribe mis_bcs_prog.p3 = {done: momentos completados de 4, pts: 0} y su estado propio en mis_bcs_p3.
  Sin puntaje: el avance se mide en momentos completados.
  Firebase: se configura una sola vez en firebase_config.js (mismo archivo para todo el sitio). Mientras diga "REEMPLAZAR", usa solo localStorage. Un proyecto Realtime Database (no Firestore).
    Nodo que se escribe: mis_bcs/p3/<id del estudiante o grupo> (se actualiza al completar un cuadro, un conjunto o una pregunta, y al terminar el recorrido).
    Incluye los TEXTOS que escribe el estudiante en las preguntas de desarrollo: avisarles que su docente los recibirá.
    Reinicio: «Borrar mi avance y empezar de nuevo» guarda antes una copia del avance en mis_bcs_hist (local) y, con Firebase activo,
    en mis_bcs_hist/p3/<id>/<clave> (solo se agrega, no se sobrescribe) y marca mis_bcs/p3/<id>/ultimoReinicio. El panel docente lee ese historial.
    Reglas sugeridas (producción): { "rules": { ".write": true, ".read": "auth != null" } }. En pruebas, lectura abierta; no usar con datos reales de estudiantes.
    Pasos: console.firebase.google.com > crear proyecto > Realtime Database > registrar app web > copiar firebaseConfig > pegar aquí y subir el archivo al repositorio (nunca subir claves reales a un repositorio público sin revisar las reglas).
-->
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Presentación 3 · Perspectivas y fundamentos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,500&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
/* Concepto: un módulo de estudio sobrio, de una sola columna. Cada sección tiene su color; el mapa del modelo vive dentro de la Sección 1. */
:root{
  --bg:#f8f5ef; --surface:#fffdf8; --ink:#0b1a33; --ink2:#4b566b; --line:#d9d0ba;
  --gold:#c9a256; --gold-ink:#7d5f17; --gold-bg:#f3e8cc; --nav:#0b1a33; --nav-ink:#f8f5ef;
  --teo:#1a4a7a; --teo-bg:#e6eef7; --emp:#1a5c38; --emp-bg:#e4f1e9;
  --ok:#1a5c38; --ok-bg:#ebf7ef; --no:#9b2226; --no-bg:#fdeeee; --info:#1a4a7a; --info-bg:#eaf1f9;
  --s0c:#1a4a7a; --s0b:#e8f0f8; --s1c:#7a3b1e; --s1b:#faf0e8; --s2c:#1a5c38; --s2b:#e8f5ee; --s3c:#4a1a6b; --s3b:#f0e8f8;
  --focus:#0b1a33;
  --ff-d:'Playfair Display',Georgia,'Times New Roman',serif;
  --ff-b:'Source Serif 4',Georgia,'Times New Roman',serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0a1428; --surface:#111f3a; --ink:#f1ece0; --ink2:#aab4c6; --line:#2a3a5c;
    --gold:#e0bd73; --gold-ink:#e0bd73; --gold-bg:#3a3118; --nav:#060d1c; --nav-ink:#f1ece0;
    --teo:#7fb0e6; --teo-bg:#14284a; --emp:#6fcb98; --emp-bg:#12332a;
    --ok:#6fcb98; --ok-bg:#10301f; --no:#f19a9d; --no-bg:#3a1618; --info:#8fbbea; --info-bg:#14284a;
    --s0c:#8fbbea; --s0b:#14284a; --s1c:#e8a985; --s1b:#3a2216; --s2c:#6fcb98; --s2b:#12332a; --s3c:#c9a0e8; --s3b:#2c1a42;
    --focus:#e0bd73; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0a1428; --surface:#111f3a; --ink:#f1ece0; --ink2:#aab4c6; --line:#2a3a5c;
  --gold:#e0bd73; --gold-ink:#e0bd73; --gold-bg:#3a3118; --nav:#060d1c; --nav-ink:#f1ece0;
  --teo:#7fb0e6; --teo-bg:#14284a; --emp:#6fcb98; --emp-bg:#12332a;
  --ok:#6fcb98; --ok-bg:#10301f; --no:#f19a9d; --no-bg:#3a1618; --info:#8fbbea; --info-bg:#14284a;
  --s0c:#8fbbea; --s0b:#14284a; --s1c:#e8a985; --s1b:#3a2216; --s2c:#6fcb98; --s2b:#12332a; --s3c:#c9a0e8; --s3b:#2c1a42;
  --focus:#e0bd73; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--ff-b);font-size:17px;line-height:1.6;margin:0;padding:0}
button{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px;border-radius:6px}
.wrap{max-width:960px;margin:0 auto;padding-inline:16px}

/* Barra superior */
.top{background:var(--nav);color:var(--nav-ink)}
.top .wrap{display:flex;align-items:center;gap:14px;min-height:60px;flex-wrap:wrap;padding-block:8px}
.top a.back{display:inline-flex;align-items:center;gap:8px;text-decoration:none;font-weight:600;font-size:15px;color:var(--nav-ink);padding:6px 10px;border-radius:8px;border:1px solid rgba(248,245,239,.28)}
.top a.back:hover{border-color:var(--gold)}
.top .ttl{font-family:var(--ff-d);font-weight:600;font-size:16px;flex:1;min-width:0;line-height:1.25}
.top .ttl small{display:block;font-family:var(--ff-b);font-weight:400;font-size:13px;opacity:.75}
.top .who{font-size:14px;padding:4px 12px;border:1px solid rgba(248,245,239,.28);border-radius:999px;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbtn{width:38px;height:38px;border-radius:50%;border:1px solid rgba(248,245,239,.28);background:none;color:var(--nav-ink);cursor:pointer;display:grid;place-items:center}
.tbtn:hover{border-color:var(--gold)}
@media (max-width:560px){.top .ttl small{display:none}.top .who{max-width:120px}}

/* Aviso de identificación */
.note{margin-top:18px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 16px;border-radius:12px;background:var(--gold-bg);border:1px solid var(--gold);font-size:15px}
.note a,.note button{font-weight:600}
.note button{background:none;border:0;padding:0;text-decoration:underline;cursor:pointer}
.note a.cta{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:999px;background:var(--ink);color:var(--bg);text-decoration:none;font-weight:700;box-shadow:0 2px 0 var(--gold)}
.note a.cta:hover{filter:brightness(1.12)}

/* Inicio */
.hero{padding-block:36px 8px}
.eyebrow{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-ink);font-weight:600;margin:0 0 8px}
h1{font-family:var(--ff-d);font-weight:700;font-size:clamp(30px,5.5vw,46px);line-height:1.12;margin:0 0 12px;text-wrap:balance}
.lead{font-size:18px;color:var(--ink2);max-width:680px;margin:0}
h2.sec-t{font-family:var(--ff-d);font-size:26px;margin:36px 0 14px;line-height:1.2}
.goals{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px;max-width:720px}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:6px}
.how div{border-top:3px solid var(--ink);padding-top:10px}
.how b{font-family:var(--ff-d);font-size:19px;display:block;margin-bottom:2px}
.how span{color:var(--ink2);font-size:15.5px}
.total{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:28px;padding:16px 18px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.total .big{font-family:var(--ff-d);font-weight:700;font-size:30px;line-height:1}
.total small{color:var(--ink2);font-size:15px}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;flex:1;min-width:140px}
.bar i{display:block;height:100%;background:var(--gold);border-radius:4px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.card .hd{background:var(--bg-c);color:var(--c);padding:16px 18px;display:flex;gap:12px;align-items:flex-start}
.card .num{flex:none;width:36px;height:36px;border-radius:50%;background:var(--c);color:var(--bg-c);display:grid;place-items:center;font-family:var(--ff-d);font-weight:700}
.card h3{font-family:var(--ff-d);font-size:20px;line-height:1.2;margin:2px 0 0}
.card .bd{padding:14px 18px 18px;display:flex;flex-direction:column;gap:12px;flex:1}
.card p{margin:0;font-size:15.5px;color:var(--ink2)}
.card .meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:var(--ink2)}
.card .meta b{color:var(--ink)}
.tagst{font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--ink2);margin-left:auto;white-space:nowrap}
.tagst.done{border-color:var(--ok);color:var(--ok)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:10px;padding:11px 18px;font-weight:600;cursor:pointer;background:var(--ink);color:var(--bg);text-decoration:none;font-size:16px}
.btn.alt{background:none;color:var(--ink);border:1px solid var(--ink)}
.btn.gold{background:var(--gold);color:#0b1a33}
.btn:hover{filter:brightness(1.08)}
.btn[disabled]{opacity:.4;cursor:default}
.card .btn{margin-top:auto;align-self:flex-start}

/* Sección */
.stepper{display:flex;gap:6px;flex-wrap:wrap;margin-top:22px}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:15px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.pill i{font-style:normal;font-size:12px;color:var(--ink2)}
.pill[aria-current="true"]{background:var(--c);color:var(--bg-c);border-color:var(--c)}
.pill[aria-current="true"] i{color:var(--bg-c)}
.pill.done i{color:var(--ok)}
.pill[aria-current="true"].done i{color:var(--bg-c)}
.sechd{margin-top:22px;border-radius:14px;background:var(--bg-c);color:var(--c);padding:22px 22px 20px;border:1px solid var(--c)}
.sechd .k{font-size:13px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;margin:0 0 6px}
.sechd h2{font-family:var(--ff-d);font-size:clamp(24px,4vw,32px);line-height:1.18;margin:0 0 10px}
.sechd p.d{margin:0;color:var(--ink);font-size:17px}
.sechd .g{margin:10px 0 0;font-size:14.5px;color:var(--ink2)}
.blk{margin-top:30px}
.blk > h3{font-family:var(--ff-d);font-size:21px;margin:0 0 4px}
.blk > p.sub{margin:0 0 14px;color:var(--ink2);font-size:15.5px}
.cloud{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:baseline}
.chip{border:1px solid var(--c);background:var(--surface);color:var(--c);border-radius:999px;padding:5px 14px;cursor:pointer;font-weight:600;line-height:1.3}
.chip[aria-pressed="true"]{background:var(--c);color:var(--bg-c)}
.def{margin-top:14px;padding:14px 16px;border-radius:12px;background:var(--bg-c);border-left:4px solid var(--c)}
.def b{font-family:var(--ff-d);font-size:18px;color:var(--c);display:block;margin-bottom:2px}
.def p{margin:0}
details.map{border:1px solid var(--line);border-radius:14px;background:var(--surface);margin-top:26px}
details.map > summary{cursor:pointer;padding:14px 18px;font-family:var(--ff-d);font-size:19px;font-weight:600;list-style:none;display:flex;gap:10px;align-items:center}
details.map > summary::-webkit-details-marker{display:none}
details.map > summary::before{content:"";width:9px;height:9px;border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:rotate(-45deg);transition:transform .15s;flex:none}
details.map[open] > summary::before{transform:rotate(45deg)}
details.map > summary small{font-family:var(--ff-b);font-weight:400;font-size:14.5px;color:var(--ink2);margin-left:auto}
details.map .inner{padding:4px 16px 18px}
.prog{display:flex;align-items:center;gap:12px;margin:26px 0 0;padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);position:sticky;top:0;z-index:5}
.prog .bar i{background:var(--c)}
.prog span{font-size:15px;white-space:nowrap}

/* Ítems */
.q{padding:18px 0;border-bottom:1px solid var(--line)}
.q:last-child{border-bottom:0}
.q .qt{font-weight:600;margin:0 0 12px}
.q .qn{color:var(--c);font-family:var(--ff-d);margin-right:6px}
.frag{margin:0 0 12px;padding:10px 14px;border-left:4px solid var(--c);background:var(--bg-c);border-radius:0 10px 10px 0;font-style:italic}
.fq{margin:0 0 10px;font-size:15.5px;color:var(--ink2)}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;cursor:pointer;display:flex;gap:10px;align-items:flex-start;line-height:1.45}
.opt:hover:not([disabled]){border-color:var(--c)}
.opt .l{font-weight:700;color:var(--c);flex:none}
.opt[disabled]{cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--no);background:var(--no-bg)}
.opt.dim{opacity:.62}
.pair{display:flex;gap:10px;flex-wrap:wrap}
.pair .opt{flex:1 1 200px;justify-content:center;align-items:center;text-align:center;font-weight:600}
.fb{margin-top:12px;padding:12px 14px;border-radius:10px;font-size:16px;line-height:1.55;display:flex;gap:12px;align-items:flex-start}
.fb.ok{background:var(--ok-bg);border:1px solid var(--ok)}
.fb.no{background:var(--info-bg);border:1px solid var(--info)}
.fb svg{flex:none;margin-top:3px}
.fb.ok svg{color:var(--ok)} .fb.no svg{color:var(--info)}
.fb p{margin:0}
.fb .ref{display:block;margin-top:6px;font-size:14px;color:var(--ink2)}
.fb .ref b{color:var(--ink)}

/* Resultado */
.res{margin-top:34px;border:2px solid var(--c);border-radius:16px;background:var(--surface);padding:22px}
.res h3{font-family:var(--ff-d);font-size:24px;margin:0 0 4px}
.res .score{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:6px 0 10px}
.res .score b{font-family:var(--ff-d);font-size:44px;line-height:1;color:var(--c)}
.res .brk{display:flex;gap:8px 18px;flex-wrap:wrap;color:var(--ink2);font-size:15px;margin:0 0 12px}
.res .rev{margin:14px 0 0;padding:12px 16px;border-radius:12px;background:var(--bg-c)}
.res .rev b{display:block;margin-bottom:4px}
.res .rev ul{margin:0;padding-left:20px}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}

footer{margin-top:56px;background:var(--nav);color:var(--nav-ink)}
footer .wrap{padding-block:32px}
footer .f-n{margin:0;font:700 17px/1.3 var(--ff-d)}
footer .f-s{margin:6px 0 0;font-size:14.5px;line-height:1.6;opacity:.82;max-width:60ch}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;font-size:15px;z-index:50;max-width:calc(100% - 32px)}

.reset{margin-top:36px;padding-top:20px;border-top:1px solid var(--line)}
.reset .btn.alt{font-size:15px;padding:9px 16px}
.reset-box{padding:16px 18px;border:1px solid var(--no);border-radius:12px;background:var(--no-bg)}
.reset-box p{margin:0 0 6px;line-height:1.55}
.btn.danger{background:var(--no);color:var(--bg)}

/* ===== Presentación: estaciones, cuadros, clasificación y desarrollo ===== */
.muted{color:var(--ink2);font-size:15px}
.stt{font-family:var(--ff-d);font-size:23px;line-height:1.25;margin:0 0 12px}
.before{margin:0 0 16px;padding:14px 16px;border:1px dashed var(--c);border-radius:12px;background:var(--surface)}
.before p{margin:0 0 10px}
.before .btn{margin-top:4px}
dl.items{margin:6px 0 0}
dl.items dt{font-weight:600;color:var(--c);margin-top:14px;font-family:var(--ff-d);font-size:18px}
dl.items dd{margin:2px 0 0;max-width:760px}
.conn{margin-top:18px;padding:12px 16px;border-left:4px solid var(--gold);background:var(--gold-bg);border-radius:0 12px 12px 0}
.conn b{display:block;margin-bottom:2px}
.conn p,.conn ul{margin:0}
.conn ul{padding-left:20px}
.doneline{margin:12px 0 0;color:var(--ok);font-weight:600}
.pc{border:1px solid var(--c);background:var(--surface);color:var(--ink);border-radius:10px;padding:9px 13px;text-align:left;cursor:pointer;line-height:1.4;font-size:15.5px}
.pc:hover{background:var(--bg-c)}
.pc[aria-pressed="true"]{outline:3px solid var(--gold);outline-offset:1px;background:var(--gold-bg)}
.pc.ok{border-color:var(--ok);background:var(--ok-bg)}
.pc.no{border-color:var(--no);background:var(--no-bg)}
.pieces{display:flex;flex-wrap:wrap;gap:8px}
.bank{margin-top:22px;display:grid;gap:16px;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.bank h5{margin:0 0 8px;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2);font-weight:600}
.slot{width:100%;min-height:58px;border:2px dashed var(--line);border-radius:10px;background:var(--bg);padding:9px 12px;text-align:left;cursor:pointer;color:var(--ink);line-height:1.4;font-size:15.5px}
.slot .ph{color:var(--ink2);font-size:14.5px}
.slot.target{border-color:var(--gold)}
.slot.has{border-style:solid;border-color:var(--c);background:var(--surface)}
.slot.ok{border-color:var(--ok);background:var(--ok-bg)}
.slot.no{border-color:var(--no);background:var(--no-bg)}
.boxes{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:14px}
.bx{border:2px solid var(--c);border-radius:12px;background:var(--bg-c);padding:12px}
.bx h4{margin:0 0 10px;font-family:var(--ff-d);font-size:18px;color:var(--c);line-height:1.25}
.slotlist{display:flex;flex-direction:column;gap:8px}
.gridb{display:grid;gap:12px}
.grow{display:grid;grid-template-columns:minmax(110px,.55fr) repeat(var(--nc),minmax(0,1fr));gap:10px;align-items:stretch}
.grow .rl{font-family:var(--ff-d);font-weight:700;color:var(--c);padding:8px 4px;display:flex;align-items:center;line-height:1.25}
.ghead{position:static}
.chd{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);font-weight:600;align-self:end}
.clab{display:none;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);margin-bottom:4px}
.cell{display:flex;flex-direction:column}
.cell .slot{flex:1}
@media (max-width:760px){
  .grow{grid-template-columns:minmax(0,1fr);padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
  .ghead{display:none}
  .clab{display:block}
}
.q .opts{gap:8px}
textarea{width:100%;min-height:200px;font:inherit;line-height:1.55;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);resize:vertical}
textarea.short{min-height:110px}
.tl{display:block;font-weight:600;margin:18px 0 6px}
.cnt{margin:6px 0 0;color:var(--ink2);font-size:14.5px}
ol.incl{margin:0 0 10px;padding-left:22px;display:flex;flex-direction:column;gap:6px}
.self{display:flex;flex-direction:column;gap:12px}
.selfrow{padding-bottom:12px;border-bottom:1px solid var(--line)}
.selfrow p{margin:0 0 8px}
.selfrow .qn{color:var(--c);font-family:var(--ff-d);margin-right:6px;font-weight:700}
.tri{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.tri button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;cursor:pointer;font-size:15px}
.tri button[aria-pressed="true"]{background:var(--c);color:var(--bg-c);border-color:var(--c)}
details.refbox{margin-top:18px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
details.refbox > summary{cursor:pointer;padding:12px 16px;font-family:var(--ff-d);font-weight:600;font-size:18px}
details.refbox .inner{padding:0 16px 14px}
details.refbox .inner p{margin:8px 0}

«todos los auxiliares» se estrecha: ante evidencia contradictoria se descarta el concepto o se reduce el alcance de la categoría (pp. 155-157)."]], "conn": "Lectura 1 (Ragin, cap. 3): imagen, marco analítico y representación son los bloques del modelo; ahora ves cómo se aclaran entre sí en un caso concreto."}, {"id": "e3", "title": "Los ocho momentos del proceso y la flexibilidad", "slides": "Láminas 5 y 6", "prompt": "Antes de ver la lámina: ¿qué decisiones toma quien investiga en profundidad un caso, desde que lo elige hasta que lo representa?", "items": [["1. Seleccionar casos y sitios", "según el fin del estudio; a veces un caso típico (ejemplo ilustrativo: una facultad de medicina)."], ["2. Partir de conceptos guía", "preliminares e intuitivos, sin quedar atado a ellos (ejemplo hipotético: «clase social» en pacientes de hospital)."], ["3. Reunir manifestaciones y construir imágenes", "se recogen varias manifestaciones y se vuelve más selectivo al aprender (ilustración: entrevistar a 35 auxiliares de vuelo)."], ["4. Aclarar conceptos y categorías", "proceso de doble vía entre imágenes, conceptos y categorías (Hochschild y el trabajo emocional)."], ["5. Enfrentar casos negativos", "comparar constantemente y, ante pruebas contradictorias, reformular el concepto o reducir la categoría (Becker y quienes fuman marihuana por aparentar)."], ["6. Reconocer la saturación", "detenerse cuando lo nuevo resulta repetitivo, sabiendo que puede alcanzarse de forma prematura (ejemplo hipotético: taxistas rumanos)."], ["7. Ampliar (no todos lo hacen)", "sumar casos por muestreo teórico o elaborar un marco analítico (Ebaugh; el trabajo emocional extendido a otras ocupaciones)."], ["8. Representar el caso", "presentar los conceptos refinados; decidir a qué caso pertenece el objeto suele ser la última fase."], ["Flexibilidad y su límite", "los conceptos iniciales pueden modificarse o descartarse (p. 153); el marco parte vago y se desarrolla (p. 157); los casos sirven para desarrollar ideas, no para comprobar teorías (p. 149). El límite: el investigador se hace más selectivo a medida que conoce el caso (pp. 145, 148)."]], "conn": "Lectura 1 (Ragin, cap. 3): los marcos fluidos, que son más comunes en la investigación cualitativa."}, {"id": "e4", "title": "Técnicas habituales e inmersión", "slides": "Lámina 7", "prompt": "Antes de ver la lámina: ¿qué significa «sumergirse» en un caso y qué estudios no pueden hacerlo?", "items": [["Técnicas con las que se identifica", "observación participante, entrevistas en profundidad, trabajo de campo y estudio etnográfico (p. 159)."], ["Mead (antropología)", "la inmersión puede implicar vivir en un pueblo aislado en una parte remota del mundo; Ragin cita Coming of Age in Samoa (p. 159)."], ["Goffman (sociología)", "largos períodos de observación y numerosas conversaciones con el personal y los pacientes de una institución mental, en Asylums (p. 159)."], ["Para qué sirve", "descubrir el significado que los fenómenos tienen para quienes los viven (p. 159)."], ["Su límite", "no todo estudio cualitativo puede lograrla: los acontecimientos de un pasado distante no pueden verse por los ojos de los participantes (pp. 159-160)."]], "conn": "Lectura 2 (Flick): las perspectivas de los participantes y su diversidad, y el poder de reflexión del investigador."}, {"id": "e5", "title": "Finalidades de la investigación cualitativa y selección de casos", "slides": "Láminas 8 y 9", "prompt": "Antes de ver la lámina: ¿para qué se investiga cualitativamente y cómo cambia eso el tipo de caso que se elige?", "items": [["Dar voz", "busca representar mejor a grupos marginados cuyas vidas se representan de forma inadecuada. El enfoque estudia de cerca lo cercano y llega a grupos que escapan a otros enfoques. Se puede seleccionar un grupo específico (pp. 146-147, 150)."], ["Interpretar lo histórico o cultural", "busca reinterpretar acontecimientos que afectan cómo nos comprendemos como sociedad. Exige atención cercana al detalle histórico y un sustento empírico sólido para la nueva imagen. Se puede seleccionar un conjunto específico de acontecimientos u otra porción de la vida social (pp. 147, 150)."], ["Hacer progresar la teoría", "busca generar nuevas ideas teóricas. El conocimiento en profundidad es materia prima teórica: obliga a aclarar conceptos y permite ver aspectos comunes entre casos distintos. Se puede escoger un caso inusual que ofrezca una oportunidad especial para elaborar ideas (pp. 148-150)."]], "conn": "Lectura 1 (Ragin, cap. 3): «dar voz» como fin de la investigación, que puede llevar a limitar el peso de las ideas preexistentes."}, {"id": "e6", "title": "Inducción analítica, muestreo teórico y caso único", "slides": "Láminas 14 a 17", "prompt": "Antes de ver las láminas: ¿qué hace que comparar casos sirva para desarrollar conceptos y no solo para describirlos?", "items": [["Inducción analítica", "su sentido original era la búsqueda de «universales» (una sola excepción bastaría); hoy es cualquier examen sistemático de parecidos para desarrollar conceptos o ideas. Ragin la vería como una estrategia que pone en tensión las imágenes del investigador. El avance se ve en cuánto se ha depurado y delimitado la imagen, y basta una correspondencia razonable, no perfecta (pp. 161-163, 167). Ejemplo: Katz y los abogados del turno de oficio (pp. 164-168)."], ["Muestreo teórico", "elección deliberada de nuevos sitios o casos para compararlos con uno ya estudiado, guiada por las preguntas surgidas en el primero y no por comodidad. No busca capturar todas las variaciones, sino desarrollar conceptos (pp. 169-171). Ilustraciones: activistas del medio ambiente comparados con los de otros países y con los religiosos; Revolución rusa comparada con la china (p. 170); hospitales con más y menos recursos, ejemplo hipotético (pp. 171-172); Ebaugh, Becker y Goffman (pp. 172-173)."], ["Caso único", "la vida de una persona o un acontecimiento histórico único. Los hechos relevantes para el marco equivalen a las manifestaciones de la inducción analítica y se busca una doble correspondencia entre interpretación y hechos (pp. 174-175). Ejemplo hipotético: la dimisión de Nixon."], ["Relación entre las tres", "Ragin señala que la inducción analítica y el muestreo teórico funcionan mejor con varias manifestaciones del fenómeno y que el caso único se estructura de manera similar a la inducción analítica (p. 174)."]], "conn": "Lectura 2 (Flick): la estrategia inductiva, que desarrolla teorías a partir de estudios empíricos en lugar de comprobar teorías previas."}, {"id": "e7", "title": "La triangulación según Denzin", "slides": "Láminas 19 a 24", "prompt": "Antes de ver la lámina: ¿por qué mirar un mismo problema desde un solo lugar puede sesgar un estudio?", "items": [["Idea central", "Denzin (1978) propone examinar un mismo problema desde varios observadores, teorías, métodos y fuentes de datos, para superar el sesgo propio de los estudios que dependen de un solo método, un solo observador o una sola teoría."], ["Origen del término", "viene de la navegación y la topografía: una posición se determina a partir de mediciones hechas desde puntos distintos. Ragin (2007, p. 172) usa la misma analogía de los marineros que localizaban su posición con las estrellas y trigonometría simple."], ["Cuatro tipos", "de datos (tiempo, espacio y persona), de investigadores, de teorías y metodológica (dentro de un mismo método o entre métodos distintos)."], ["Los que más se confunden", "la triangulación de datos y la metodológica: la primera varía cuándo, dónde y a quién se recogen los datos; la segunda varía el método o la técnica."], ["Ejemplo en el texto de Ragin", "al comparar tres hospitales a lo largo de un continuo de recursos, el investigador puede valorar la validez y la generalidad de lo hallado en el primero; Ragin lo presenta como triangulación de datos (p. 172)."], ["Láminas 22 a 24", "extractos de Denzin (2012), «Triangulation 2.0», Journal of Mixed Methods Research, 6(2), 80-88: propone una narrativa que no confunda pragmatismo con triangulación y destaca el compromiso ético de la investigación cualitativa."]], "conn": "Lectura 3 (Ragin, cap. 4): el ejemplo de los hospitales dentro del apartado sobre muestreo teórico."}], "B": [{"id": "c1", "kind": "boxes", "title": "¿Por qué lo cualitativo puede parecer menos científico?", "slides": "Láminas 2 y 3", "intro": "Ubica cada enunciado en el cuadro que le corresponde: lo que solemos asociar a la ciencia social o lo que sostiene el enfoque cualitativo.", "slots": [{"id": "A", "label": "Lo que solemos asociar a la ciencia social", "cap": 3}, {"id": "B", "label": "Lo que sostiene el enfoque cualitativo", "cap": 3}], "chips": [{"id": "a1", "t": "Se asocia con afirmaciones taxativas y generales.", "home": "A", "why": "Es parte de lo que solemos asociar a la ciencia social: afirmaciones generales y panorámicas (p. 143)."}, {"id": "a2", "t": "Resume en un porcentaje o una estadística la información de innumerables casos.", "home": "A", "why": "Es la «visión panorámica» que solemos asociar a la ciencia social (p. 143)."}, {"id": "a3", "t": "No dice nada sobre los casos individuales.", "home": "A", "why": "Es lo que se reprocha a la visión panorámica y por eso va entre lo que solemos asociar a la ciencia social (p. 143)."}, {"id": "b1", "t": "Una comprensión adecuada se alcanza examinando en profundidad casos específicos.", "home": "B", "why": "Es la tesis central del enfoque cualitativo (p. 143)."}, {"id": "b2", "t": "Al ser menos estructurada y sin marco explícito, recibe la acusación de ser «meramente descriptiva».", "home": "B", "why": "Es la acusación que recibe el enfoque cualitativo y que la lámina ubica en este cuadro; la réplica de Ragin es el enunciado siguiente (pp. 149, 158)."}, {"id": "b3", "t": "Sin conceptos es imposible seleccionar la evidencia y darle sentido.", "home": "B", "why": "Es la réplica de Ragin a la acusación de ser meramente descriptivo (p. 158)."}]}, {"id": "c2", "kind": "grid", "title": "Finalidades de la investigación cualitativa y selección de casos", "slides": "Láminas 8 y 9", "intro": "Completa el cuadro: elige una pieza para cada casilla. Las piezas están agrupadas por columna.", "rows": [{"id": "dv", "label": "Dar voz"}, {"id": "hi", "label": "Interpretar lo histórico o cultural"}, {"id": "te", "label": "Hacer progresar la teoría"}], "cols": [{"id": "b", "label": "Qué busca"}, {"id": "a", "label": "Por qué el enfoque cualitativo es adecuado"}, {"id": "s", "label": "Cómo se puede seleccionar"}], "chips": [{"id": "dv.b", "t": "Representar mejor a grupos marginados, cuyas vidas se representan de forma inadecuada.", "home": "dv.b", "why": "Representar mejor a grupos marginados es la finalidad de «dar voz» (pp. 146-147)."}, {"id": "hi.b", "t": "Reinterpretar acontecimientos que afectan cómo nos comprendemos como sociedad.", "home": "hi.b", "why": "Reinterpretar acontecimientos relevantes para la sociedad es lo que busca «interpretar lo histórico o cultural» (p. 147)."}, {"id": "te.b", "t": "Generar nuevas ideas teóricas.", "home": "te.b", "why": "Generar nuevas ideas teóricas es la meta de «hacer progresar la teoría» (p. 148)."}, {"id": "dv.a", "t": "Estudia de cerca lo cercano, llegando a grupos que escapan a otros enfoques.", "home": "dv.a", "why": "Llegar a grupos que escapan a otros enfoques justifica el enfoque cualitativo para «dar voz» (p. 147)."}, {"id": "hi.a", "t": "Exige atención cercana al detalle histórico y sustento empírico sólido para la nueva imagen.", "home": "hi.a", "why": "La atención al detalle histórico y el sustento empírico de la nueva imagen justifican el enfoque para lo histórico o cultural (p. 147)."}, {"id": "te.a", "t": "Obliga a aclarar conceptos y permite ver aspectos comunes entre casos distintos.", "home": "te.a", "why": "El conocimiento en profundidad como materia prima teórica justifica el enfoque para «hacer progresar la teoría» (pp. 148-149)."}, {"id": "dv.s", "t": "Un grupo específico.", "home": "dv.s", "why": "Para dar voz se selecciona un grupo específico (p. 150)."}, {"id": "hi.s", "t": "Un conjunto específico de acontecimientos u otra porción de la vida social.", "home": "hi.s", "why": "Para interpretar lo histórico o cultural se selecciona un conjunto específico de acontecimientos u otra porción de la vida social (p. 150)."}, {"id": "te.s", "t": "Un caso inusual en algún sentido, que ofrezca una oportunidad especial para elaborar ideas.", "home": "te.s", "why": "Para hacer progresar la teoría se puede escoger un caso inusual (p. 150)."}]}, {"id": "c3", "kind": "grid", "title": "Los cuatro tipos de triangulación", "slides": "Lámina 21", "intro": "Completa el cuadro de la lámina: en qué consiste cada tipo de triangulación y un ejemplo ilustrativo.", "rows": [{"id": "da", "label": "De datos"}, {"id": "in", "label": "De investigadores"}, {"id": "te", "label": "De teorías"}, {"id": "me", "label": "Metodológica"}], "cols": [{"id": "c", "label": "En qué consiste"}, {"id": "e", "label": "Ejemplo ilustrativo"}], "chips": [{"id": "da.c", "t": "Varía cuándo, dónde y a quién se recogen los datos (tiempo, espacio y persona).", "home": "da.c", "why": "Variar tiempo, espacio y persona de la recolección define la triangulación de datos."}, {"id": "in.c", "t": "Usa varios observadores, y no uno solo, sobre el mismo objeto, lo que ayuda a limitar los sesgos y el estilo de un investigador individual.", "home": "in.c", "why": "Usar varios observadores es la triangulación de investigadores."}, {"id": "te.c", "t": "Usa varias perspectivas sobre el mismo conjunto de objetos y permite evaluar la utilidad de teorías o hipótesis rivales.", "home": "te.c", "why": "Usar varias perspectivas teóricas para evaluar teorías rivales es la triangulación de teorías."}, {"id": "me.c", "t": "Varía el método o la técnica con la que se aborda el fenómeno, dentro de un mismo método o entre métodos distintos.", "home": "me.c", "why": "Variar el método o la técnica es la triangulación metodológica."}, {"id": "da.e", "t": "Entrevistas en dos momentos del año y en dos sedes.", "home": "da.e", "why": "Cambian el momento y el lugar de la recolección: triangulación de datos."}, {"id": "in.e", "t": "Dos personas codifican por separado las entrevistas y contrastan sus interpretaciones.", "home": "in.e", "why": "Hay dos observadores sobre el mismo material: triangulación de investigadores."}, {"id": "te.e", "t": "Interpretar las mismas entrevistas desde dos marcos teóricos distintos.", "home": "te.e", "why": "Se aplican dos perspectivas teóricas al mismo material: triangulación de teorías."}, {"id": "me.e", "t": "Entrevistas más grupos focales, o entrevistas más una encuesta.", "home": "me.e", "why": "Se combinan técnicas distintas: triangulación metodológica."}]}], "D": [{"id": "d1", "title": "Inducción analítica, muestreo teórico o caso único", "slides": "Láminas 14 a 17", "opts": ["Inducción analítica", "Muestreo teórico", "Caso único"], "intro": "Indica a qué estrategia corresponde cada descripción.", "items": [{"q": "Los nuevos casos se eligen a partir de las preguntas que surgieron en el primero y no por conveniencia.", "ans": 1, "tip": "Es el muestreo teórico: la elección deliberada de casos para compararlos con uno ya estudiado está guiada por las preguntas del primer caso, no por comodidad o disponibilidad.", "ref": "Lámina 16 · Ragin, cap. 4, «El muestreo teórico»"}, {"q": "Se examinan manifestaciones que parecen pertenecer a una misma categoría y luego se buscan pruebas contradictorias.", "ans": 0, "tip": "Es la inducción analítica: parte de manifestaciones que parecen ser de la misma categoría y busca activamente pruebas que las contradigan para depurar el concepto.", "ref": "Lámina 14 · Ragin, cap. 4, «La inducción analítica»"}, {"q": "El marco analítico define qué hechos son relevantes y cuáles no, y esos hechos cumplen el papel de evidencia.", "ans": 2, "tip": "Es el caso único: los hechos relevantes para el marco propuesto equivalen a las manifestaciones de la inducción analítica.", "ref": "Láminas 14 y 17 · Ragin, cap. 4, «El estudio de un caso único»"}, {"q": "El avance se juzga por cuánto se ha depurado y delimitado la imagen, más que por el número de casos que la corroboran.", "ans": 0, "tip": "Es la inducción analítica: lo que indica el avance es el grado de depuración de la imagen, y alcanza una correspondencia razonable, no perfecta.", "ref": "Lámina 14 · Ragin, cap. 4, «La inducción analítica»"}, {"q": "Se interpreta la dimisión de Nixon como un golpe a la autoridad del gobierno y se evalúa si todos los hechos relevantes se ajustan a esa única interpretación.", "ans": 2, "tip": "Es el caso único (ejemplo hipotético): se busca una doble correspondencia entre interpretación y hechos, que lleva a alguna correspondencia o a un punto muerto.", "ref": "Lámina 17 · Ragin, cap. 4, «El estudio de un caso único»"}, {"q": "Para construir un marco sobre el abandono de roles sociales se muestrearon distintas clases de «ex algo»: ex monjas, ex doctores, madres sin la custodia de sus hijos.", "ans": 1, "tip": "Es el muestreo teórico: Ebaugh sumó grupos distintos de forma deliberada y llegó a un marco analítico completamente desarrollado.", "ref": "Láminas 5 y 14 · Ragin, cap. 4, «El muestreo teórico»"}]}, {"id": "d2", "title": "¿Qué tipo de triangulación es?", "slides": "Láminas 19 a 21", "opts": ["De datos", "De investigadores", "De teorías", "Metodológica"], "intro": "Clasifica cada situación según los cuatro tipos de triangulación de Denzin.", "items": [{"q": "Se entrevista en dos momentos del año y en dos sedes.", "ans": 0, "tip": "Es triangulación de datos: varían el momento y el lugar donde se recogen los datos.", "ref": "Lámina 21"}, {"q": "Dos integrantes del equipo codifican por separado las entrevistas y luego contrastan sus interpretaciones.", "ans": 1, "tip": "Es triangulación de investigadores: hay más de un observador sobre el mismo objeto, lo que limita los sesgos de un investigador individual.", "ref": "Lámina 21"}, {"q": "Las mismas entrevistas se interpretan desde dos marcos teóricos distintos para ver cuál resulta más útil.", "ans": 2, "tip": "Es triangulación de teorías: varias perspectivas sobre el mismo conjunto de objetos permiten evaluar la utilidad de teorías rivales.", "ref": "Lámina 21"}, {"q": "Un estudio combina entrevistas con grupos focales para abordar el mismo fenómeno.", "ans": 3, "tip": "Es triangulación metodológica: cambia el método o la técnica con que se aborda el fenómeno, y no quién, cuándo ni dónde se recogen los datos.", "ref": "Lámina 21"}, {"q": "El investigador usa las pruebas de otros dos hospitales, uno con más y otro con menos recursos, para formarse una mejor opinión sobre el primer hospital.", "ans": 0, "tip": "Ragin lo presenta como triangulación de datos: se usan piezas independientes de información de otros sitios para valorar la validez y la generalidad de lo hallado en el primero.", "ref": "Lámina 20 · Ragin, cap. 4, «El muestreo teórico»"}, {"q": "Se combinan entrevistas con una encuesta para estudiar el mismo fenómeno.", "ans": 3, "tip": "Es triangulación metodológica entre métodos distintos. Recuerda que datos y metodológica son las que más se confunden: la primera varía cuándo, dónde y a quién; la segunda varía la técnica.", "ref": "Láminas 19 y 21"}]}, {"id": "d3", "title": "Imagen, concepto, categoría empírica o marco analítico", "slides": "Láminas 10, 11 y 13", "opts": ["Imagen", "Concepto", "Categoría empírica", "Marco analítico"], "intro": "Indica a cuál de estos cuatro elementos corresponde cada descripción o ejemplo del texto de Ragin.", "items": [{"q": "La representación que el investigador construye del entusiasta de las armas a partir de sus casos y que va refinando.", "ans": 0, "tip": "Es una imagen del objeto: una representación construida a partir de los casos y refinada por el investigador.", "ref": "Lámina 10 · Ragin, cap. 4, «Introducción»"}, {"q": "Manipulación consciente de los sentimientos para crear una expresión corporal y fisonómica observable públicamente.", "ans": 1, "tip": "Es el concepto de «trabajo emocional», que Hochschild fue aclarando junto con su imagen del auxiliar de vuelo.", "ref": "Lámina 11 · Ragin, cap. 4, «Introducción»"}, {"q": "Los auxiliares de vuelo, entendidos como el conjunto de manifestaciones similares del fenómeno estudiado, del que se espera cierta homogeneidad respecto del concepto.", "ans": 2, "tip": "Es una categoría empírica: agrupa manifestaciones similares de los fenómenos sociales. Ante evidencia contradictoria, su alcance puede reducirse.", "ref": "Láminas 10 y 13 · Ragin, cap. 4, «Introducción» y «La depuración de los conceptos y las categorías»"}, {"q": "El marco completo que Ebaugh desarrolló al final sobre el abandono de roles sociales, cuyos componentes cruciales son conceptos.", "ans": 3, "tip": "Es un marco analítico: sus componentes cruciales son los conceptos y Ebaugh lo elaboró por muestreo teórico.", "ref": "Láminas 10 y 14 · Ragin, cap. 4, «El muestreo teórico»"}, {"q": "Idea general que puede aplicarse a muchas manifestaciones específicas.", "ans": 1, "tip": "Es la definición de concepto: síntesis abstracta de propiedades compartidas por una categoría.", "ref": "Lámina 10 · Ragin, cap. 4, «Introducción»"}, {"q": "Al comienzo de un estudio cualitativo está vagamente formulado y se desarrolla durante la investigación.", "ans": 3, "tip": "Es el marco analítico: en lo cualitativo parte preliminar y vago, y se desarrolla en el transcurso del estudio.", "ref": "Láminas 6 y 10 · Ragin, cap. 4, «El proceso de investigación cualitativa»"}]}], "Q": [{"id": "q1", "tag": "Explicar y relacionar", "title": "Por qué lo cualitativo puede parecer menos científico", "ask": "Explica por qué el enfoque cualitativo puede parecer menos científico y qué respuestas se le dan desde la presentación y las lecturas.", "sources": "Presentación 3 (láminas 2 a 4) · Ragin, cap. 4 · Flick (Lectura 2)", "incl": ["Qué se asocia a la «ciencia» social (afirmaciones generales, visiones panorámicas que resumen casos en una cifra) y por qué desde ahí lo cualitativo parece «meramente descriptivo».", "La réplica de Ragin y lo que se pierde con la visión panorámica.", "Al menos un argumento de Flick sobre los límites de lo cuantitativo.", "La diferencia entre agregar datos y realzar datos."], "concepts": ["visión panorámica", "conocimiento en profundidad", "agregar y realzar datos", "ideales de objetividad", "pluralización de los mundos vitales"], "length": "De 6 a 9 líneas.", "starter": "Lo cualitativo puede parecer menos científico porque…", "review": ["Presentación 3, láminas 2 a 4", "Ragin, cap. 4: «Introducción», «El proceso de investigación cualitativa» y «El uso de los métodos cualitativos»", "Flick: «Límites de la investigación cuantitativa como punto de partida», «Relevancia de la investigación cualitativa» y «Conveniencia de los métodos y las teorías»"], "answers": [{"label": "Una forma posible", "text": ["Lo cualitativo puede parecer menos científico porque solemos asociar la ciencia social con afirmaciones generales y con visiones panorámicas, es decir, cifras que resumen la información de innumerables casos. Frente a ese modelo, el enfoque cualitativo examina casos específicos en profundidad, con un marco menos estructurado y explícito, y por eso se lo acusa de ser «meramente descriptivo».", "Quienes investigan cualitativamente sostienen que una comprensión adecuada se alcanza examinando casos en profundidad, y Ragin muestra que la visión panorámica pierde justamente eso: ante la fascinación por las armas, cabe preguntarse si una imagen panorámica dice algo valioso sobre esa fascinación misma. Además, sin conceptos es imposible seleccionar la evidencia y darle sentido, de modo que el trabajo cualitativo no es mera descripción. En la misma línea, Flick sostiene que los ideales de objetividad de la investigación cuantitativa no se satisfacen del todo, que la pluralización de los mundos vitales vuelve relevante la investigación cualitativa y que los métodos deben ser lo bastante abiertos como para hacer justicia a la complejidad del objeto. Por eso conviene distinguir agregar datos (condensar muchos casos en una imagen general) de realzar datos (ver con más claridad aspectos fundamentales de los casos, como al enfocar una fotografía)."]}]}, {"id": "q2", "tag": "Analizar un caso del texto", "title": "De la imagen inicial al concepto o marco", "ask": "Elige uno de los estudios que cita Ragin (Hochschild, Becker o Ebaugh) y explica cómo avanzó desde una imagen inicial hasta un concepto o un marco analítico.", "sources": "Presentación 3 (láminas 5, 10, 11, 13 y 14) · Ragin, cap. 4 · Ragin, cap. 3 (Lectura 1)", "incl": ["El estudio que elegiste, el grupo o la categoría que estudió y el concepto o marco que desarrolló.", "Cómo se aclararon entre sí la imagen y el concepto, o qué papel tuvieron los casos negativos o la ampliación por muestreo teórico.", "Al menos dos de los ocho momentos de la lámina 5 que se reconocen en ese estudio.", "Al menos dos términos del modelo de la Lectura 1 (pruebas empíricas, imagen, marco analítico, representación) para decir qué producía cada paso."], "concepts": ["aclaración recíproca", "casos negativos", "muestreo teórico", "categoría empírica", "marco analítico"], "length": "De 7 a 10 líneas.", "starter": "Elijo el estudio de… porque…", "review": ["Presentación 3, láminas 5, 10, 11, 13 y 14", "Ragin, cap. 4: «Introducción», «La depuración de los conceptos y las categorías», «La elaboración de marcos analíticos» y «El muestreo teórico»", "Ragin, cap. 3: «Un modelo simple de investigación social»"], "answers": [{"label": "Hochschild", "text": ["Hochschild estudió a los auxiliares de vuelo, que deben mostrar con frecuencia ciertas apariencias a los pasajeros. A partir de esas pruebas empíricas construyó una imagen del trabajo del auxiliar de vuelo y la fue refinando a medida que aclaraba el concepto de «trabajo emocional». Imagen y concepto se aclararon recíprocamente (momento 4 de la lámina 5) hasta la representación final del estudio.", "En el supuesto hipotético de Ragin, si solo algunos auxiliares usaran el trabajo emocional, la categoría amplia debería estrecharse o el concepto descartarse (momento 5, casos negativos). Una vez desarrollado, el marco puede aplicarse a otras ocupaciones orientadas a la atención personal de clientes, como guías turísticos o camareras (momento 7, ampliar). En el modelo de la Lectura 1: las pruebas empíricas dieron lugar a la imagen, y el concepto pasó a ser un componente del marco analítico."]}, {"label": "Becker", "text": ["Becker estudió el proceso de convertirse en consumidor habitual de marihuana. Con más de cincuenta entrevistas, vio que casi todos pasaban por un aprendizaje social para disfrutar la droga y especuló que todos los consumidores habituales (la categoría) lo experimentaban (el concepto). Aparecieron casos negativos: unos pocos la usaban por aparentar y no la disfrutaban (momento 5, lámina 5).", "Becker reformuló reduciendo la categoría a quienes la usaban por placer, lo que logró una correspondencia más cercana entre categoría y concepto (momentos 5 y 4). Después estudió otros grupos «desviados», los reunió en un marco analítico único, el de los «marginales», con un proceso dual de aprendizaje social y etiquetamiento (momento 7, ampliar; Ragin lo presenta como muestreo teórico). En el modelo de la Lectura 1: las pruebas empíricas (entrevistas) dieron lugar a la imagen, y esa imagen interactúa con el marco analítico."]}, {"label": "Ebaugh", "text": ["Ebaugh estudió a mujeres que habían sido monjas y dejaron las órdenes religiosas, y con ese grupo desarrolló el concepto de «abandono de un rol social» (momento 4 de la lámina 5). Se interesó por personas cuya identidad estaba muy influida por roles que habían abandonado y diseñó una estrategia deliberada de muestreo teórico: ex doctores, madres sin la custodia de sus hijos, transexuales y otros «ex algo» (momento 7).", "Cada grupo aportó pruebas sobre un tipo distinto de abandono de rol y el producto final fue un marco analítico completamente desarrollado. En el modelo de la Lectura 1: las pruebas empíricas de cada grupo alimentaron las imágenes, y el producto final fue un marco analítico completo."]}]}, {"id": "q3", "tag": "Comparar y justificar", "title": "Estrategias de comparación y triangulación", "ask": "Compara la inducción analítica y el muestreo teórico, y explica por qué el ejemplo de los hospitales de Ragin puede entenderse como triangulación de datos y no como triangulación metodológica.", "sources": "Presentación 3 (láminas 14 a 16 y 19 a 21) · Ragin, cap. 4", "incl": ["Al menos dos criterios de comparación entre ambas estrategias (qué se examina, qué orienta la selección, qué se busca, qué indica el avance).", "Cómo es el ejemplo de los hospitales y qué permite valorar.", "La definición de triangulación de datos y su diferencia con la metodológica (lámina 21).", "Por qué Ragin presenta el ejemplo como triangulación de datos: qué idea se quería explorar y qué información independiente se usa."], "concepts": ["inducción analítica", "muestreo teórico", "triangulación de datos", "triangulación metodológica", "validez y generalidad"], "length": "De 8 a 10 líneas.", "starter": "Ambas estrategias comparan casos, pero…", "review": ["Presentación 3, láminas 14 a 16 y 19 a 21", "Ragin, cap. 4: «La inducción analítica» y «El muestreo teórico»"], "answers": [{"label": "Una forma posible", "text": ["Ambas estrategias comparan casos para desarrollar conceptos, pero se organizan de manera distinta. La inducción analítica examina varias manifestaciones que parecen pertenecer a una misma categoría y busca pruebas contradictorias; su avance se ve en cuánto se ha depurado y delimitado la imagen. El muestreo teórico, en cambio, elige de forma deliberada nuevos sitios o casos para compararlos con uno ya estudiado, guiado por las preguntas surgidas en el primero y no por conveniencia, y busca desarrollar conceptos sin pretender capturar todas las variaciones.", "En el ejemplo hipotético de Ragin, el investigador sospecha que la práctica del hospital estudiado se explica por sus recursos limitados y, para explorar esa idea, estudia otros dos hospitales, uno con más recursos y otro con menos. Al comparar los tres a lo largo de un continuo de recursos puede valorar la validez y la generalidad de lo hallado en el primero. Según la lámina 21, la triangulación de datos varía cuándo, dónde y a quién se recogen los datos, y la metodológica varía el método o la técnica. Ragin llama triangulación de datos al ejemplo porque usa piezas independientes de información de otros sitios; aquí varía el dónde y no el método, de modo que no es una triangulación metodológica."]}]}], "minw": 40};

function fbLoad(cb){
  var ini=function(){if(!firebase.apps.length)firebase.initializeApp(FIREBASE_CONFIG);cb()};
  if(window.firebase){ini();return}
  var a=document.createElement('script');a.src='https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js';
  a.onload=function(){var b=document.createElement('script');b.src='https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js';b.onload=ini;document.head.appendChild(b)};

}
function histFlush(){
  if(!FB_OK||PREVIEW)return;
  var a=lsGet(HK)||[];
  if(!a.some(function(x){return !x.sent}))return;
  try{fbLoad(function(){
    (lsGet(HK)||[]).forEach(function(x){
      if(x.sent)return;
      var db=firebase.database();
      db.ref('mis_bcs_hist/'+x.mod+'/'+x.sid+'/'+x.k).set({id:x.sid,name:x.name,mode:x.mode,members:x.members,mod:x.mod,ts:x.ts,prog:x.prog,estado:x.estado})
        .then(function(){return db.ref('mis_bcs/'+x.mod+'/'+x.sid+'/ultimoReinicio').transaction(function(c){return Math.max(c||0,x.ts)})})
        .then(function(){var b=lsGet(HK)||[];b.forEach(function(y){if(y.k===x.k)y.sent=true});lsSet(HK,b)})
        .catch(function(){});
    });
  })}catch(e){}
}

/* ---------- Momento 2 ---------- */
function chipById(b,id){return byId(b.chips,id)}
function occ(b,slot){var st=s2(b.id),r=[];for(var c in st.place)if(st.place[c]===slot)r.push(c);return r}
function placed(b,c){return s2(b.id).place[c]}
function chipBtn(b,c,cls){return '<button type="button" class="pc'+(cls?' '+cls:'')+'" data-act="chip" data-id="'+c.id+'" aria-pressed="'+(view.sel===c.id)+'">'+esc(c.t)+'</button>'}
function slotBtn(b,slotId,label){
  var st=s2(b.id),oc=occ(b,slotId),cls='slot',ch;
  if(oc.length){cls+=' has';ch=chipById(b,oc[0]);if(view.chk[ch.id]===true)cls+=' ok';if(view.chk[ch.id]===false)cls+=' no'}
  else if(view.sel)cls+=' target';
  var inner=oc.length?esc(chipById(b,oc[0]).t):'<span class="ph">Toca para colocar la pieza elegida</span>';
  return '<button type="button" class="'+cls+'" data-act="slot" data-slot="'+slotId+'" aria-label="'+esc(label)+(oc.length?'. Contiene una pieza; tócala para quitarla':'. Vacía')+'">'+inner+'</button>';
}
function vBoard(b){
  var st=s2(b.id),h='';
  h+='<p class="sub">'+esc(b.intro)+' <span class="muted">('+esc(b.slides)+')</span></p>';
  var unp=b.chips.filter(function(c){return !placed(b,c.id)}).sort(function(x,y){return hsh(x.id)-hsh(y.id)});
  if(b.kind==='boxes'){
    h+='<div class="boxes">'+b.slots.map(function(sl){
      var oc=occ(b,sl.id);
      return '<div class="bx"><h4>'+esc(sl.label)+'</h4><div class="slotlist">'+oc.map(function(c){var ch=chipById(b,c);return chipBtn(b,ch,(view.chk[c]===true?'ok':(view.chk[c]===false?'no':'')))}).join('')
       +'<button type="button" class="slot'+(view.sel?' target':'')+'" data-act="slot" data-slot="'+sl.id+'" aria-label="Colocar la pieza elegida en «'+esc(sl.label)+'»"><span class="ph">Toca para colocar aquí</span></button></div></div>';
    }).join('')+'</div>';
    h+='<div class="bank"><h5>Piezas por colocar</h5><div class="pieces">'+(unp.length?unp.map(function(c){return chipBtn(b,c)}).join(''):'<span class="muted">Ya colocaste todas las piezas.</span>')+'</div></div>';
  }else{
    var nc=b.cols.length;
    h+='<div class="gridb" style="--nc:'+nc+'"><div class="grow ghead"><span></span>'+b.cols.map(function(c){return '<span class="chd">'+esc(c.label)+'</span>'}).join('')+'</div>';
    b.rows.forEach(function(r){
      h+='<div class="grow"><span class="rl">'+esc(r.label)+'</span>'+b.cols.map(function(c){var id=r.id+'.'+c.id;return '<div class="cell"><span class="clab">'+esc(c.label)+'</span>'+slotBtn(b,id,r.label+', '+c.label)+'</div>'}).join('')+'</div>';
    });
    h+='</div><div class="bank">'+b.cols.map(function(c){
      var g=unp.filter(function(p){return p.home.split('.')[1]===c.id});
      return '<div class="bgrp"><h5>Piezas de «'+esc(c.label)+'»</h5><div class="pieces">'+(g.length?g.map(function(p){return chipBtn(b,p)}).join(''):'<span class="muted">Sin piezas pendientes.</span>')+'</div></div>';
    }).join('')+'</div>';
  }
  var allp=b.chips.every(function(c){return placed(b,c.id)});
  var msg=view.msg[b.id];
  h+='<div class="acts"><button type="button" class="btn" data-act="check"'+(allp?'':' disabled')+'>Comprobar</button>'
   +(st.checks>0&&!st.done?'<button type="button" class="btn alt" data-act="solve">Ver la solución</button>':'')
   +'<button type="button" class="btn alt" data-act="reset">Reiniciar cuadro</button></div>';
  if(!allp)h+='<p class="muted" style="margin-top:8px">Coloca todas las piezas para poder comprobar.</p>';
  if(msg)h+='<div class="fb '+(msg.ok?'ok':'no')+'" role="status">'+icon(msg.ok)+'<div>'+msg.html+'</div></div>';
  if(st.done)h+='<p class="doneline">'+(st.assisted?'Cuadro completado con la solución a la vista. Repítelo más tarde sin ayuda para fijarlo.':'Cuadro completado.')+'</p>';
  return h;
}
function vM2(){
  var b=B[view.tab];
  var h=head('m2',MOM[1].title,MOM[1].desc)+tabs(B.map(function(x,i){return (i+1)+'. '+x.title.split(' ').slice(0,4).join(' ')+'…'}),function(i){return s2(B[i].id).done});
  h+='<section class="blk"><h3 class="stt">'+esc(b.title)+'</h3>'+vBoard(b)+'</section>'+backRow();
  app.innerHTML=h;
}
function onChip(b,id){
  var st=s2(b.id);
  if(placed(b,id)){delete st.place[id];delete view.chk[id];delete view.msg[b.id];view.sel=null;save();render();return}
  view.sel=(view.sel===id)?null:id;render();
}
function onSlot(b,slot){
  var st=s2(b.id),oc=occ(b,slot);
  if(!view.sel){
    if(oc.length&&b.kind==='grid'){delete st.place[oc[0]];delete view.chk[oc[0]];delete view.msg[b.id];save();render()}
    else toast('Primero toca una pieza de la lista.');
    return;
  }
  var ch=chipById(b,view.sel);
  if(b.kind==='grid'){
    if(ch.home.split('.')[1]!==slot.split('.')[1]){toast('Esa pieza pertenece a otra columna.');return}
    if(oc.length){delete st.place[oc[0]];delete view.chk[oc[0]]}
  }
  st.place[ch.id]=slot;delete view.chk[ch.id];delete view.msg[b.id];view.sel=null;save();render();
}
function slotLabel(b,slot){
  if(b.kind==='boxes')return byId(b.slots,slot).label;
  var p=slot.split('.');return byId(b.rows,p[0]).label+' · '+byId(b.cols,p[1]).label;
}
function onCheck(b){
  var st=s2(b.id),bad=[],chk={};
  b.chips.forEach(function(c){var ok=placed(b,c.id)===c.home;chk[c.id]=ok;if(!ok)bad.push(c)});
  view.chk=chk;st.checks++;
  if(!bad.length){st.done=true;view.msg[b.id]={ok:true,html:'<p><b>Correcto. </b>Todas las piezas están en su lugar.</p>'};save();report();render();return}
  var li=bad.map(function(c){
    var short=c.t.length>70?c.t.slice(0,67)+'…':c.t;
    return '<li><b>«'+esc(short)+'»</b> no va en «'+esc(slotLabel(b,placed(b,c.id)))+'». '+esc(c.why)+'</li>';
  }).join('');
  view.msg[b.id]={ok:false,html:'<p><b>Para revisar. </b>Estas piezas no están en su lugar (quedaron marcadas):</p><ul>'+li+'</ul><p class="ref">Puedes moverlas y comprobar de nuevo, o pedir la solución.</p>'};
  save();render();
}
function onSolve(b){
  var st=s2(b.id);b.chips.forEach(function(c){st.place[c.id]=c.home});
  st.assisted=true;st.done=true;view.chk={};
  b.chips.forEach(function(c){view.chk[c.id]=true});
  view.msg[b.id]={ok:true,html:'<p><b>Solución a la vista. </b>Léela con calma: cada pieza está en el lugar que indica la lámina.</p>'};
  save();report();render();
}
function onReset(b){var st=s2(b.id);st.place={};view.chk={};delete view.msg[b.id];view.sel=null;save();render()}

/* ---------- Momento 3 ---------- */
function vM3(){
  var d=D[view.tab],st=s3(d.id);
  var h=head('m3',MOM[2].title,MOM[2].desc)+tabs(D.map(function(x,i){return (i+1)+'. '+x.title.split(' ').slice(0,4).join(' ')+'…'}),function(i){return s3(D[i].id).done});
  h+='<section class="blk"><h3 class="stt">'+esc(d.title)+'</h3><p class="sub">'+esc(d.intro)+' <span class="muted">('+esc(d.slides)+')</span></p>';

    var a=st.ans[i],has=a!==undefined&&a!==null;

    }).join('');
    h+='<div class="q"><p class="qt"><span class="qn">'+(i+1)+'.</span>'+esc(it.q)+'</p><div class="opts">'+opts+'</div>'+(has?fb(a===it.ans,it.tip,it.ref):'')+'</div>';
  });
  var n=st.ans.filter(function(a){return a!==undefined&&a!==null}).length;
  if(n===d.items.length){

    h+='<div class="res" style="'+mStyle(2)+'"><h3>Conjunto completado</h3>'+(miss.length?'<div class="rev"><b>Conviene repasar estos puntos:</b><ul>'+miss.map(function(x){return '<li>Ejemplo '+(x.i+1)+': '+esc(x.it.ref)+'</li>'}).join('')+'</ul></div>':'<p>Clasificaste bien todos los ejemplos.</p>')
     +'<div class="acts"><button type="button" class="btn alt" data-act="again">Repetir este conjunto</button>'+(view.tab<D.length-1?'<button type="button" class="btn" data-act="tab" data-i="'+(view.tab+1)+'">Siguiente conjunto</button>':'<button type="button" class="btn gold" data-act="home">Volver al inicio</button>')+'</div></div>';
  }else h+='<p class="muted" style="margin-top:14px">Respondidos: '+n+' de '+d.items.length+'.</p>';
  h+='</section>'+backRow();
  app.innerHTML=h;
}
function onAns(i,v){
  var d=D[view.tab],st=s3(d.id);
  if(st.ans[i]!==undefined&&st.ans[i]!==null)return;
  st.ans[i]=v;
  if(st.ans.filter(function(a){return a!==undefined&&a!==null}).length===d.items.length){
    st.last=d.items.filter(function(it,k){return st.ans[k]===it.ans}).length;st.done=true;st.tries=Math.max(st.tries,1);report();
  }
  save();render();
}

    var ans=q.answers[Math.min(s.variant,q.answers.length-1)];
    h+='<details class="refbox"'+(s.refOpen?' open':'')+'><summary data-act="refsum">Ver una respuesta de referencia</summary><div class="inner"><p class="muted">Es una forma posible de responder, no la única. Compárala con la tuya.</p>'
     +(q.answers.length>1?'<div class="tri" role="group" aria-label="Estudio elegido">'+q.answers.map(function(a,i){return '<button type="button" aria-pressed="'+(s.variant===i)+'" data-act="variant" data-i="'+i+'">'+esc(a.label)+'</button>'}).join('')+'</div>':'')
     +ans.text.map(function(p){return '<p>'+esc(p)+'</p>'}).join('')+'</div></details>';
    h+='<div class="conn"><b>Dónde repasar</b><ul>'+q.review.map(function(t){return '<li>'+esc(t)+'</li>'}).join('')+'</ul></div>';
    h+='<label class="tl" for="rv">Después de comparar: ¿qué agregarías o corregirías en tu respuesta? (opcional)</label><textarea id="rv" class="short" data-rv="'+q.id+'" placeholder="Anota los ajustes que harías…">'+esc(s.rev)+'</textarea>';
    var ready=q.incl.every(function(_,i){return s.self[i]});
    h+='<div class="acts"><button type="button" class="btn gold" data-act="finish" id="fin"'+(ready?'':' disabled')+'>'+(s.done?'Guardar cambios':'Completar esta pregunta')+'</button></div>';
    if(!ready)h+='<p class="muted" style="margin-top:8px">Marca los '+q.incl.length+' elementos de la autoevaluación para completar la pregunta.</p>';
    if(s.done)h+='<p class="doneline">Pregunta completada.</p>';
  }
  h+='</section>';
  h+='<div class="acts">'+(hasText()?'<button type="button" class="btn alt" data-act="dl">Descargar mis respuestas</button>':'')+'<button type="button" class="btn alt" data-act="home">Volver al inicio</button></div>';
  app.innerHTML=h;
}
function descargar(){
  var r=reg(),t='PRESENTACIÓN 3 · Perspectivas y fundamentos de la investigación cualitativa\nMetodología de la Investigación Social · Módulo cualitativo · Bachillerato en Ciencias Sociales, UFRO\n'+(r&&r.name?('Estudiante: '+r.name+'\n'):'')+'Fecha: '+new Date().toLocaleDateString('es-CL')+'\n\n';
  Q.forEach(function(q,i){
    var s=s4(q.id);
    t+='==== Pregunta '+(i+1)+' · '+q.tag+' ====\n'+q.ask+'\n\nMI RESPUESTA:\n'+(s.text||'(sin respuesta)')+'\n\n';
    if(s.self&&s.self.length)t+='AUTOEVALUACIÓN:\n'+q.incl.map(function(x,k){return (k+1)+'. '+({si:'Lo incluí',parte:'En parte',no:'No lo incluí'}[s.self[k]]||'sin marcar')+' — '+x}).join('\n')+'\n\n';
    if(s.rev)t+='AJUSTES QUE HARÍA:\n'+s.rev+'\n\n';
  });
  var blob=new Blob([t],{type:'text/plain;charset=utf-8'}),a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download='mis_respuestas_presentacion_3.txt';document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},500);
}

/* ---------- Render y eventos ---------- */
function render(){
  paintWho();
  if(view.name==='home')vHome();else if(view.name==='m1')vM1();else if(view.name==='m2')vM2();else if(view.name==='m3')vM3();else vM4();
}
var saveT;
app.addEventListener('input',function(e){
  var t=e.target;
  if(t.hasAttribute('data-ta')){
    var s=s4(t.getAttribute('data-ta'));s.text=t.value;var w=words(t.value);
    var wc=$('#wc');if(wc)wc.textContent=w;var b=$('#stg');if(b)b.disabled=w<MINW;
    clearTimeout(saveT);saveT=setTimeout(save,400);
  }else if(t.hasAttribute('data-rv')){
    s4(t.getAttribute('data-rv')).rev=t.value;clearTimeout(saveT);saveT=setTimeout(save,400);
  }
});
app.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');if(!el||el.disabled)return;
  var a=el.getAttribute('data-act'),i=parseInt(el.getAttribute('data-i'),10),v=el.getAttribute('data-v');
  if(a==='open')go(el.getAttribute('data-k'),0);
  else if(a==='ask'){view.ask=true;render();var rn=$('#rst-no');if(rn){rn.focus();rn.scrollIntoView({block:'center'})}}
  else if(a==='rst-no'){view.ask=false;render()}
  else if(a==='rst-yes')resetAll();
  else if(a==='home')go('home');
  else if(a==='tab'){view.tab=i;view.sel=null;view.chk={};render();window.scrollTo(0,0)}
  else if(a==='reveal'){ST.m1[el.getAttribute('data-id')]=true;save();if(momDone('m1'))report();render()}
  else if(a==='chip')onChip(B[view.tab],el.getAttribute('data-id'));
  else if(a==='slot')onSlot(B[view.tab],el.getAttribute('data-slot'));
  else if(a==='check')onCheck(B[view.tab]);
  else if(a==='solve')onSolve(B[view.tab]);
  else if(a==='reset')onReset(B[view.tab]);
  else if(a==='ans')onAns(i,parseInt(v,10));
  else if(a==='again'){var st=s3(D[view.tab].id);st.ans=[];st.tries++;save();render();window.scrollTo(0,0)}
  else if(a==='starter'){var q=Q[view.tab],s=s4(q.id);if(!s.text){s.text=q.starter+' ';save();render();var ta=$('#ta');if(ta){ta.focus();ta.setSelectionRange(ta.value.length,ta.value.length)}}}
  else if(a==='stage'){var s=s4(Q[view.tab].id);s.stage=1;save();render()}
  else if(a==='self'){var s=s4(Q[view.tab].id);s.self[i]=v;save();render()}
  else if(a==='variant'){var s=s4(Q[view.tab].id);s.variant=i;s.refOpen=true;save();render()}
  else if(a==='refsum'){var s=s4(Q[view.tab].id);s.refOpen=!s.refOpen}
  else if(a==='finish'){var q=Q[view.tab],s=s4(q.id);s.done=true;s.ts=Date.now();save();report();toast('Pregunta completada y guardada.');render()}
  else if(a==='dl')descargar();
});
render();
histFlush();
window.addEventListener('storage',function(e){if(e.key===KEYS.mod&&e.newValue===null){ST=freshST();go('home')}});
window.__P3={ST:function(){return ST},DATA:DATA,go:go};
})();

</script>
