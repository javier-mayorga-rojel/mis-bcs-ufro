function words(t){return (t||'').trim().split(/\s+/).filter(Boolean).length}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1)}
function hsh(s){var h=7;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))%9973;return h}
function byId(a,id){for(var i=0;i<a.length;i++)if(a[i].id===id)return a[i]}

/* ---------- Estado ---------- */
var ST=lsGet(KEYS.mod)||{};
function freshST(){return {v:1,m1:{},m2:{},m3:{},m4:{}}}
if(!ST.v){ST=freshST()}
['m1','m2','m3','m4'].forEach(function(k){if(!ST[k])ST[k]={}});
function s2(id){return ST.m2[id]||(ST.m2[id]={place:{},checks:0,done:false,assisted:false})}
function s3(id){return ST.m3[id]||(ST.m3[id]={ans:[],done:false,tries:0,last:0})}
function s4(id){return ST.m4[id]||(ST.m4[id]={text:'',stage:0,self:[],rev:'',done:false,ts:0,variant:0})}
var view={name:'home',tab:0,sel:null,chk:{},msg:{}};
function momDone(k){
  if(k==='m1')return S.every(function(s){return ST.m1[s.id]});
  if(k==='m2')return B.every(function(b){return s2(b.id).done});
  if(k==='m3')return D.every(function(d){return s3(d.id).done});
  if(k==='m4')return Q.every(function(q){return s4(q.id).done});
  return false;
}
function doneCount(){return ['m1','m2','m3','m4'].filter(momDone).length}
function save(){lsSet(KEYS.mod,ST);var p=lsGet(KEYS.prog)||{};p[META.id]={done:doneCount(),pts:0,ts:Date.now()};lsSet(KEYS.prog,p)}
function reg(){return lsGet(KEYS.reg)}
function hasText(){return Q.some(function(q){return s4(q.id).text})}

/* ---------- Reinicio del módulo ---------- */
var MODID=META.id;
/* Registro para el docente: cada reinicio guarda una copia del avance previo (bandeja local mis_bcs_hist)
   y la envía a Firebase en mis_bcs_hist/[módulo]/[id]/[clave]; así el registro no depende de que el estudiante conserve su avance.
   Solo se registra si el estudiante está identificado. */
var HK='mis_bcs_hist';
function histAdd(estado,prog){
  var r=reg();if(!r||!r.id)return;
  var a=lsGet(HK)||[],ts=Date.now();
  a.push({k:'r'+ts+'_'+MODID,mod:MODID,sid:r.id,name:r.name||'',mode:r.mode||'individual',members:r.members||[],ts:ts,prog:prog||null,estado:estado,sent:false});
  if(a.length>40)a=a.slice(-40);
  lsSet(HK,a);
}
function fbLoad(cb){
  var ini=function(){if(!firebase.apps.length)firebase.initializeApp(FIREBASE_CONFIG);cb()};
  if(window.firebase){ini();return}
  var a=document.createElement('script');a.src='https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js';
  a.onload=function(){var b=document.createElement('script');b.src='https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js';b.onload=ini;document.head.appendChild(b)};
  document.head.appendChild(a);
}
function histFlush(){
  if(!FB_OK||PREVIEW)return;
  var a=lsGet(HK)||[];
  if(!a.some(function(x){return !x.sent}))return;
  try{fbLoad(function(){
    (lsGet(HK)||[]).forEach(function(x){
      if(x.sent)return;
      var db=firebase.database();
      db.ref('mis_bcs_hist/'+x.mod+'/'+x.sid+'/'+x.k).set({id:x.sid,name:x.name,mode:x.mode,members:x.members,mod:x.mod,ts:x.ts,prog:x.prog,estado:x.estado})
        .then(function(){return db.ref('mis_bcs/'+x.mod+'/'+x.sid+'/ultimoReinicio').transaction(function(c){return Math.max(c||0,x.ts)})})
        .then(function(){var b=lsGet(HK)||[];b.forEach(function(y){if(y.k===x.k)y.sent=true});lsSet(HK,b)})
        .catch(function(){});
    });
  })}catch(e){}
}
function hasProgress(){
  return Object.keys(ST.m1).length>0
   ||B.some(function(b){var s=ST.m2[b.id];return s&&(s.done||s.checks>0||Object.keys(s.place||{}).length>0)})
   ||D.some(function(d){var s=ST.m3[d.id];return s&&(s.done||s.tries>0||(s.ans||[]).length>0)})
   ||Q.some(function(q){var s=ST.m4[q.id];return s&&(s.done||s.text||s.stage||s.rev||(s.self||[]).length>0)});
}
function resetBlock(){
  if(!view.ask)return '<div class="reset"><button type="button" class="btn alt" data-act="ask">Borrar mi avance y empezar de nuevo</button></div>';
  return '<div class="reset"><div class="reset-box" role="group" aria-labelledby="rst-t"><p id="rst-t"><b>¿Borrar tu avance en esta presentación?</b></p>'
   +'<p>Se borrarán tus respuestas, los momentos completados y los textos que escribiste, en este navegador.'+(reg()?' Tu docente conservará el registro de lo que ya hiciste.':'')+(hasText()?' Si quieres conservar tus textos, descárgalos antes con «Descargar mis respuestas».':'')+'</p>'
   +'<div class="acts"><button type="button" class="btn danger" data-act="rst-yes">Sí, borrar y empezar de nuevo</button><button type="button" class="btn alt" id="rst-no" data-act="rst-no">Cancelar</button></div></div></div>';
}
function resetAll(){
  if(hasProgress())histAdd(JSON.parse(JSON.stringify(ST)),(lsGet(KEYS.prog)||{})[MODID]||null);
  ST=freshST();lsDel(KEYS.mod);var pg=lsGet(KEYS.prog)||{};delete pg[MODID];lsSet(KEYS.prog,pg);
  go('home');
  histFlush();
  toast('Empezaste de nuevo. Tu avance en esta presentación quedó en cero.');
}


/* ---------- Reporte a Firebase (opcional) ---------- */
function summary(){
  var r=reg()||{id:'anon',name:'Sin identificar'};
  var o={id:r.id,name:r.name,mode:r.mode||'individual',members:r.members||[],pres:META.id,ts:Date.now(),momentos:{},tableros:{},conjuntos:{},preguntas:{}};
  ['m1','m2','m3','m4'].forEach(function(k){o.momentos[k]=momDone(k)});
  B.forEach(function(b){var s=s2(b.id);o.tableros[b.id]={done:s.done,comprobaciones:s.checks,conAyuda:s.assisted}});
  D.forEach(function(d){var s=s3(d.id);o.conjuntos[d.id]={done:s.done,aciertos:s.last,max:d.items.length,intentos:s.tries}});
  Q.forEach(function(q){var s=s4(q.id);o.preguntas[q.id]={done:s.done,texto:s.text,palabras:words(s.text),autoevaluacion:s.self,ajustes:s.rev,ts:s.ts}});
  return o;
}
function report(){
  if(!FB_OK||PREVIEW)return;
  try{
    var p=summary();
    var go=function(){if(!firebase.apps.length)firebase.initializeApp(FIREBASE_CONFIG);firebase.database().ref('mis_bcs/'+META.id+'/'+p.id).update(p)};
    if(window.firebase){go();return}
    var a=document.createElement('script');a.src='https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js';
    a.onload=function(){var b=document.createElement('script');b.src='https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js';b.onload=go;document.head.appendChild(b)};
    document.head.appendChild(a);
  }catch(e){}
}

/* ---------- Tema y cabecera ---------- */
function applyTheme(t){if(t)document.documentElement.setAttribute('data-theme',t);else document.documentElement.removeAttribute('data-theme')}
(function(){var t=lsGet(KEYS.theme);if(t==='light'||t==='dark')applyTheme(t)})();
$('#theme').addEventListener('click',function(){
  var cur=document.documentElement.getAttribute('data-theme');
  var dark=cur?cur==='dark':window.matchMedia('(prefers-color-scheme: dark)').matches;
  var n=dark?'light':'dark';applyTheme(n);lsSet(KEYS.theme,n);
});
function paintWho(){var r=reg(),w=$('#who');if(r&&r.name){w.textContent=(r.mode==='grupo'?'Grupo: ':'')+r.name;w.hidden=false}else w.hidden=true}
$('#back').addEventListener('click',function(e){if(PREVIEW){e.preventDefault();toast('En la vista previa el portal no está disponible.')}});

/* ---------- Utilidades de vista ---------- */
var app=$('#app');
function mStyle(i){return '--c:var(--s'+i+'c);--bg-c:var(--s'+i+'b)'}
function mIdx(k){return ['m1','m2','m3','m4'].indexOf(k)}
function icon(ok){return ok?'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"/></svg>':'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16.5v.01"/></svg>'}
function fb(ok,tip,ref){return '<div class="fb '+(ok?'ok':'no')+'">'+icon(ok)+'<div><p><b>'+(ok?'Correcto. ':'Para revisar. ')+'</b>'+esc(tip)+'</p><span class="ref"><b>Dónde repasarlo:</b> '+esc(ref)+'</span></div></div>'}
function status(k){
  var started=false;
  if(k==='m1')started=S.some(function(s){return ST.m1[s.id]});
  if(k==='m2')started=B.some(function(b){var s=s2(b.id);return s.checks>0||Object.keys(s.place).length>0});
  if(k==='m3')started=D.some(function(d){return s3(d.id).ans.some(function(a){return a!==undefined&&a!==null})});
  if(k==='m4')started=Q.some(function(q){return s4(q.id).text});
  return momDone(k)?'Completado':(started?'En curso':'Sin empezar');
}
function dataNote(){
  var r=reg();
  if(r&&FB_OK)return 'Cuando completes cada pregunta de desarrollo, tu respuesta se envía a tu docente. También queda guardada en este navegador.';
  return 'Tus respuestas escritas quedan solo en este navegador. Descárgalas para conservarlas o enviarlas por correo.';
}
function head(k,title,desc){var i=mIdx(k);return '<section class="sechd" style="'+mStyle(i)+'"><p class="k">Momento '+(i+1)+' de 4</p><h2>'+esc(title)+'</h2><p class="d">'+esc(desc)+'</p></section>'}
function tabs(items,doneFn){
  return '<div class="stepper" role="tablist">'+items.map(function(t,i){var d=doneFn(i);return '<button type="button" class="pill'+(d?' done':'')+'" role="tab" data-act="tab" data-i="'+i+'" aria-current="'+(view.tab===i)+'"'+'>'+esc(t)+'<i>'+(d?'✓':'')+'</i></button>'}).join('')+'</div>';
}
function backRow(){return '<div class="acts"><button type="button" class="btn alt" data-act="home">Volver al inicio</button></div>'}
function go(name,tab){view={name:name,tab:tab||0,sel:null,chk:{},msg:{}};render();window.scrollTo(0,0)}

/* ---------- Inicio ---------- */
function vHome(){
  var noreg=!reg(),dc=doneCount();
  var h='<section class="hero"><p class="eyebrow">'+esc(META.eyebrow)+'</p><h1>'+esc(META.h1)+'</h1>'
   +'<p class="lead">'+esc(META.lead)+'</p></section>';
  if(noreg)h+='<div class="note"><span>Aún no te has identificado. Tu avance no quedará registrado en el sistema.</span>'+(PREVIEW?'':'<a class="cta" href="index_mis_bcs.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="M10 17l5-5-5-5"/><path d="M15 12H3"/></svg>Ingresa en el portal para identificarte</a>')+'</div>';
  h+='<h2 class="sec-t">Lo que vas a lograr</h2><ul class="goals">'+META.goals.map(function(g){return '<li>'+esc(g)+'</li>'}).join('')+'</ul>';
  h+='<h2 class="sec-t">Cómo funciona</h2><div class="how">'
   +'<div><b>Sin puntaje</b><span>Lo que cuenta es completar cada momento. Verás qué revisar y dónde, no una nota.</span></div>'
   +'<div><b>A tu ritmo</b><span>Puedes salir y volver: todo lo que haces se guarda en este navegador.</span></div>'
   +'<div><b>Todo sale de tus materiales</b><span>Láminas de la presentación y las tres lecturas del módulo. No se necesita nada más.</span></div></div>';
  h+='<div class="total"><div><div class="big">'+dc+' <small>de 4 momentos completados</small></div></div><div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="4" aria-valuenow="'+dc+'" aria-label="Momentos completados"><i style="width:'+(dc*25)+'%"></i></div></div>';
  h+='<h2 class="sec-t">Momentos</h2><div class="cards">';
  MOM.forEach(function(m,i){
    var st=status(m.id),lbl=st==='Completado'?'Repasar':(st==='En curso'?'Continuar':'Empezar');
    h+='<article class="card" style="'+mStyle(i)+'"><div class="hd"><span class="num" aria-hidden="true">'+(i+1)+'</span><div><h3>'+esc(m.title)+'</h3></div><span class="tagst'+(st==='Completado'?' done':'')+'">'+st+'</span></div>'
     +'<div class="bd"><p>'+esc(m.desc)+'</p><div class="meta"><span>'+esc(m.meta)+'</span></div><button type="button" class="btn" data-act="open" data-k="'+m.id+'">'+lbl+'</button></div></article>';
  });
  h+='</div>';
  if(dc===4)h+='<div class="res" style="'+mStyle(2)+'"><h3>Completaste la Presentación '+META.num+'</h3><p>Recorriste las láminas, reconstruiste los cuadros, clasificaste los ejemplos y desarrollaste las tres preguntas. Puedes volver a cualquier momento para repasar.</p></div>';
  if(hasText())h+='<div class="acts"><button type="button" class="btn gold" data-act="dl">Descargar mis respuestas</button></div>';
  if(hasProgress())h+=resetBlock();
  app.innerHTML=h;
}

/* ---------- Momento 1 ---------- */
function vM1(){
  var s=S[view.tab],seen=!!ST.m1[s.id],n=S.filter(function(x){return ST.m1[x.id]}).length;
  var h=head('m1',MOM[0].title,MOM[0].desc);
  h+=tabs(S.map(function(x,i){return (i+1)+'. '+x.title.split(' ').slice(0,3).join(' ')+'…'}),function(i){return ST.m1[S[i].id]});
  h+='<div class="prog" style="'+mStyle(0)+'"><div class="bar"><i style="width:'+Math.round(n/S.length*100)+'%"></i></div><span>'+n+' de '+S.length+' estaciones vistas</span></div>';
  h+='<section class="blk"><p class="eyebrow">'+esc(s.slides)+'</p><h3 class="stt">'+esc(s.title)+'</h3>';
  h+='<div class="before"><p><b>Piensa primero.</b> '+esc(s.prompt)+'</p>'+(seen?'':'<button type="button" class="btn" data-act="reveal" data-id="'+s.id+'">Ya lo pensé: mostrar lo que dice la lámina</button>')+'</div>';
  if(seen){
    h+='<dl class="items">'+s.items.map(function(it){return '<dt>'+esc(it[0])+'</dt><dd>'+esc(cap(it[1]))+'</dd>'}).join('')+'</dl>';
    h+='<div class="conn"><b>Conecta con las lecturas</b><p>'+esc(s.conn)+'</p></div>';
  }
  h+='<div class="acts">'+(view.tab>0?'<button type="button" class="btn alt" data-act="tab" data-i="'+(view.tab-1)+'">Estación anterior</button>':'')
   +(view.tab<S.length-1?'<button type="button" class="btn" data-act="tab" data-i="'+(view.tab+1)+'"'+(seen?'':' disabled')+'>Siguiente estación</button>':'')+'</div></section>';
  h+='<div class="acts"><button type="button" class="btn '+(momDone('m1')?'gold':'alt')+'" data-act="home">'+(momDone('m1')?'Momento completado: volver al inicio':'Volver al inicio')+'</button></div>';
  app.innerHTML=h;
}

/* ---------- Momento 2 ---------- */
function chipById(b,id){return byId(b.chips,id)}
function occ(b,slot){var st=s2(b.id),r=[];for(var c in st.place)if(st.place[c]===slot)r.push(c);return r}
function placed(b,c){return s2(b.id).place[c]}
function chipBtn(b,c,cls){return '<button type="button" class="pc'+(cls?' '+cls:'')+'" data-act="chip" data-id="'+c.id+'" aria-pressed="'+(view.sel===c.id)+'">'+esc(c.t)+'</button>'}
function slotBtn(b,slotId,label){
  var st=s2(b.id),oc=occ(b,slotId),cls='slot',ch;
  if(oc.length){cls+=' has';ch=chipById(b,oc[0]);if(view.chk[ch.id]===true)cls+=' ok';if(view.chk[ch.id]===false)cls+=' no'}
  else if(view.sel)cls+=' target';
  var inner=oc.length?esc(chipById(b,oc[0]).t):'<span class="ph">Toca para colocar la pieza elegida</span>';
  return '<button type="button" class="'+cls+'" data-act="slot" data-slot="'+slotId+'" aria-label="'+esc(label)+(oc.length?'. Contiene una pieza; tócala para quitarla':'. Vacía')+'">'+inner+'</button>';
}
function vBoard(b){
  var st=s2(b.id),h='';
  h+='<p class="sub">'+esc(b.intro)+' <span class="muted">('+esc(b.slides)+')</span></p>';
  var unp=b.chips.filter(function(c){return !placed(b,c.id)}).sort(function(x,y){return hsh(x.id)-hsh(y.id)});
  if(b.kind==='boxes'){
    h+='<div class="boxes">'+b.slots.map(function(sl){
      var oc=occ(b,sl.id);
      return '<div class="bx"><h4>'+esc(sl.label)+'</h4><div class="slotlist">'+oc.map(function(c){var ch=chipById(b,c);return chipBtn(b,ch,(view.chk[c]===true?'ok':(view.chk[c]===false?'no':'')))}).join('')
       +'<button type="button" class="slot'+(view.sel?' target':'')+'" data-act="slot" data-slot="'+sl.id+'" aria-label="Colocar la pieza elegida en «'+esc(sl.label)+'»"><span class="ph">Toca para colocar aquí</span></button></div></div>';
    }).join('')+'</div>';
    h+='<div class="bank"><h5>Piezas por colocar</h5><div class="pieces">'+(unp.length?unp.map(function(c){return chipBtn(b,c)}).join(''):'<span class="muted">Ya colocaste todas las piezas.</span>')+'</div></div>';
  }else{
    var nc=b.cols.length;
    h+='<div class="gridb" style="--nc:'+nc+'"><div class="grow ghead"><span></span>'+b.cols.map(function(c){return '<span class="chd">'+esc(c.label)+'</span>'}).join('')+'</div>';
    b.rows.forEach(function(r){
      h+='<div class="grow"><span class="rl">'+esc(r.label)+'</span>'+b.cols.map(function(c){var id=r.id+'.'+c.id;return '<div class="cell"><span class="clab">'+esc(c.label)+'</span>'+slotBtn(b,id,r.label+', '+c.label)+'</div>'}).join('')+'</div>';
    });
    h+='</div><div class="bank">'+b.cols.map(function(c){
      var g=unp.filter(function(p){return p.home.split('.')[1]===c.id});
      return '<div class="bgrp"><h5>Piezas de «'+esc(c.label)+'»</h5><div class="pieces">'+(g.length?g.map(function(p){return chipBtn(b,p)}).join(''):'<span class="muted">Sin piezas pendientes.</span>')+'</div></div>';
    }).join('')+'</div>';
  }
  var allp=b.chips.every(function(c){return placed(b,c.id)});
  var msg=view.msg[b.id];
  h+='<div class="acts"><button type="button" class="btn" data-act="check"'+(allp?'':' disabled')+'>Comprobar</button>'
   +(st.checks>0&&!st.done?'<button type="button" class="btn alt" data-act="solve">Ver la solución</button>':'')
   +'<button type="button" class="btn alt" data-act="reset">Reiniciar cuadro</button></div>';
  if(!allp)h+='<p class="muted" style="margin-top:8px">Coloca todas las piezas para poder comprobar.</p>';
  if(msg)h+='<div class="fb '+(msg.ok?'ok':'no')+'" role="status">'+icon(msg.ok)+'<div>'+msg.html+'</div></div>';
  if(st.done)h+='<p class="doneline">'+(st.assisted?'Cuadro completado con la solución a la vista. Repítelo más tarde sin ayuda para fijarlo.':'Cuadro completado.')+'</p>';
  return h;
}
function vM2(){
  var b=B[view.tab];
  var h=head('m2',MOM[1].title,MOM[1].desc)+tabs(B.map(function(x,i){return (i+1)+'. '+x.title.split(' ').slice(0,4).join(' ')+'…'}),function(i){return s2(B[i].id).done});
  h+='<section class="blk"><h3 class="stt">'+esc(b.title)+'</h3>'+vBoard(b)+'</section>'+backRow();
  app.innerHTML=h;
}
function onChip(b,id){
  var st=s2(b.id);
  if(placed(b,id)){delete st.place[id];delete view.chk[id];delete view.msg[b.id];view.sel=null;save();render();return}
  view.sel=(view.sel===id)?null:id;render();
}
function onSlot(b,slot){
  var st=s2(b.id),oc=occ(b,slot);
  if(!view.sel){
    if(oc.length&&b.kind==='grid'){delete st.place[oc[0]];delete view.chk[oc[0]];delete view.msg[b.id];save();render()}
    else toast('Primero toca una pieza de la lista.');
    return;
  }
  var ch=chipById(b,view.sel);
  if(b.kind==='grid'){
    if(ch.home.split('.')[1]!==slot.split('.')[1]){toast('Esa pieza pertenece a otra columna.');return}
    if(oc.length){delete st.place[oc[0]];delete view.chk[oc[0]]}
  }
  st.place[ch.id]=slot;delete view.chk[ch.id];delete view.msg[b.id];view.sel=null;save();render();
}
function slotLabel(b,slot){
  if(b.kind==='boxes')return byId(b.slots,slot).label;
  var p=slot.split('.');return byId(b.rows,p[0]).label+' · '+byId(b.cols,p[1]).label;
}
function onCheck(b){
  var st=s2(b.id),bad=[],chk={};
  b.chips.forEach(function(c){var ok=placed(b,c.id)===c.home;chk[c.id]=ok;if(!ok)bad.push(c)});
  view.chk=chk;st.checks++;
  if(!bad.length){st.done=true;view.msg[b.id]={ok:true,html:'<p><b>Correcto. </b>Todas las piezas están en su lugar.</p>'};save();report();render();return}
  var li=bad.map(function(c){
    var short=c.t.length>70?c.t.slice(0,67)+'…':c.t;
    return '<li><b>«'+esc(short)+'»</b> no va en «'+esc(slotLabel(b,placed(b,c.id)))+'». '+esc(c.why)+'</li>';
  }).join('');
  view.msg[b.id]={ok:false,html:'<p><b>Para revisar. </b>Estas piezas no están en su lugar (quedaron marcadas):</p><ul>'+li+'</ul><p class="ref">Puedes moverlas y comprobar de nuevo, o pedir la solución.</p>'};
  save();render();
}
function onSolve(b){
  var st=s2(b.id);b.chips.forEach(function(c){st.place[c.id]=c.home});
  st.assisted=true;st.done=true;view.chk={};
  b.chips.forEach(function(c){view.chk[c.id]=true});
  view.msg[b.id]={ok:true,html:'<p><b>Solución a la vista. </b>Léela con calma: cada pieza está en el lugar que indica la lámina.</p>'};
  save();report();render();
}
function onReset(b){var st=s2(b.id);st.place={};view.chk={};delete view.msg[b.id];view.sel=null;save();render()}

/* ---------- Momento 3 ---------- */
function vM3(){
  var d=D[view.tab],st=s3(d.id);
  var h=head('m3',MOM[2].title,MOM[2].desc)+tabs(D.map(function(x,i){return (i+1)+'. '+x.title.split(' ').slice(0,4).join(' ')+'…'}),function(i){return s3(D[i].id).done});
  h+='<section class="blk"><h3 class="stt">'+esc(d.title)+'</h3><p class="sub">'+esc(d.intro)+' <span class="muted">('+esc(d.slides)+')</span></p>';
  d.items.forEach(function(it,i){
    var a=st.ans[i],has=a!==undefined&&a!==null;
    var opts=d.opts.map(function(t,oi){
      var cls='opt',dis='';
      if(has){dis=' disabled';if(oi===it.ans)cls+=' right';else if(oi===a)cls+=' wrong';else cls+=' dim'}
      return '<button type="button" class="'+cls+'"'+dis+' data-act="ans" data-i="'+i+'" data-v="'+oi+'"><span class="l">'+String.fromCharCode(65+oi)+'.</span><span>'+esc(t)+'</span></button>';
    }).join('');
    h+='<div class="q"><p class="qt"><span class="qn">'+(i+1)+'.</span>'+esc(it.q)+'</p><div class="opts">'+opts+'</div>'+(has?fb(a===it.ans,it.tip,it.ref):'')+'</div>';
  });
  var n=st.ans.filter(function(a){return a!==undefined&&a!==null}).length;
  if(n===d.items.length){
    var miss=d.items.map(function(it,i){return {it:it,i:i}}).filter(function(x){return st.ans[x.i]!==x.it.ans});
    h+='<div class="res" style="'+mStyle(2)+'"><h3>Conjunto completado</h3>'+(miss.length?'<div class="rev"><b>Conviene repasar estos puntos:</b><ul>'+miss.map(function(x){return '<li>Ejemplo '+(x.i+1)+': '+esc(x.it.ref)+'</li>'}).join('')+'</ul></div>':'<p>Clasificaste bien todos los ejemplos.</p>')
     +'<div class="acts"><button type="button" class="btn alt" data-act="again">Repetir este conjunto</button>'+(view.tab<D.length-1?'<button type="button" class="btn" data-act="tab" data-i="'+(view.tab+1)+'">Siguiente conjunto</button>':'<button type="button" class="btn gold" data-act="home">Volver al inicio</button>')+'</div></div>';
  }else h+='<p class="muted" style="margin-top:14px">Respondidos: '+n+' de '+d.items.length+'.</p>';
  h+='</section>'+backRow();
  app.innerHTML=h;
}
function onAns(i,v){
  var d=D[view.tab],st=s3(d.id);
  if(st.ans[i]!==undefined&&st.ans[i]!==null)return;
  st.ans[i]=v;
  if(st.ans.filter(function(a){return a!==undefined&&a!==null}).length===d.items.length){
    st.last=d.items.filter(function(it,k){return st.ans[k]===it.ans}).length;st.done=true;st.tries=Math.max(st.tries,1);report();
  }
  save();render();
}

/* ---------- Momento 4 ---------- */
function selfBtns(q,s,i){
  var cur=s.self[i];
  return ['si','parte','no'].map(function(v){var lb={si:'Lo incluí',parte:'En parte',no:'No lo incluí'}[v];return '<button type="button" aria-pressed="'+(cur===v)+'" data-act="self" data-i="'+i+'" data-v="'+v+'">'+lb+'</button>'}).join('');
}
function vM4(){
  var q=Q[view.tab],s=s4(q.id),w=words(s.text);
  var h=head('m4',MOM[3].title,MOM[3].desc)+tabs(Q.map(function(x,i){return (i+1)+'. '+x.tag}),function(i){return s4(Q[i].id).done});
  h+='<section class="blk"><p class="eyebrow">'+esc(q.tag)+'</p><h3 class="stt">'+esc(q.ask)+'</h3><p class="muted">Fuentes: '+esc(q.sources)+'</p>';
  h+='<div class="before"><p><b>Tu respuesta debería incluir:</b></p><ol class="incl">'+q.incl.map(function(t){return '<li>'+esc(t)+'</li>'}).join('')+'</ol>'
   +'<p class="muted"><b>Conceptos que conviene usar:</b> '+q.concepts.map(esc).join(' · ')+'. <b>Extensión sugerida:</b> '+esc(q.length)+'</p>'
   +(s.text?'':'<button type="button" class="btn alt" data-act="starter">Insertar un inicio de frase</button>')+'</div>';
  h+='<label class="tl" for="ta">Tu respuesta</label><textarea id="ta" data-ta="'+q.id+'" placeholder="Escribe aquí con tus propias palabras…" aria-describedby="cnt">'+esc(s.text)+'</textarea>';
  h+='<p class="cnt" id="cnt"><span id="wc">'+w+'</span> palabras · mínimo '+MINW+' para ver la autoevaluación. '+esc(dataNote())+'</p>';
  if(s.stage<1)h+='<div class="acts"><button type="button" class="btn" data-act="stage" id="stg"'+(w>=MINW?'':' disabled')+'>Ya respondí: ver la autoevaluación</button></div>';
  else{
    h+='<div class="blk"><h3>Autoevaluación</h3><p class="sub">Revisa tu respuesta contra cada elemento. Sé honesto: esto es para ti.</p><div class="self">'+q.incl.map(function(t,i){return '<div class="selfrow"><p><span class="qn">'+(i+1)+'.</span>'+esc(t)+'</p><div class="tri">'+selfBtns(q,s,i)+'</div></div>'}).join('')+'</div></div>';
    var ans=q.answers[Math.min(s.variant,q.answers.length-1)];
    h+='<details class="refbox"'+(s.refOpen?' open':'')+'><summary data-act="refsum">Ver una respuesta de referencia</summary><div class="inner"><p class="muted">Es una forma posible de responder, no la única. Compárala con la tuya.</p>'
     +(q.answers.length>1?'<div class="tri" role="group" aria-label="Estudio elegido">'+q.answers.map(function(a,i){return '<button type="button" aria-pressed="'+(s.variant===i)+'" data-act="variant" data-i="'+i+'">'+esc(a.label)+'</button>'}).join('')+'</div>':'')
     +ans.text.map(function(p){return '<p>'+esc(p)+'</p>'}).join('')+'</div></details>';
    h+='<div class="conn"><b>Dónde repasar</b><ul>'+q.review.map(function(t){return '<li>'+esc(t)+'</li>'}).join('')+'</ul></div>';
    h+='<label class="tl" for="rv">Después de comparar: ¿qué agregarías o corregirías en tu respuesta? (opcional)</label><textarea id="rv" class="short" data-rv="'+q.id+'" placeholder="Anota los ajustes que harías…">'+esc(s.rev)+'</textarea>';
    var ready=q.incl.every(function(_,i){return s.self[i]});
    h+='<div class="acts"><button type="button" class="btn gold" data-act="finish" id="fin"'+(ready?'':' disabled')+'>'+(s.done?'Guardar cambios':'Completar esta pregunta')+'</button></div>';
    if(!ready)h+='<p class="muted" style="margin-top:8px">Marca los '+q.incl.length+' elementos de la autoevaluación para completar la pregunta.</p>';
    if(s.done)h+='<p class="doneline">Pregunta completada.</p>';
  }
  h+='</section>';
  h+='<div class="acts">'+(hasText()?'<button type="button" class="btn alt" data-act="dl">Descargar mis respuestas</button>':'')+'<button type="button" class="btn alt" data-act="home">Volver al inicio</button></div>';
  app.innerHTML=h;
}
function descargar(){
  var r=reg(),t='PRESENTACIÓN '+META.num+' · '+META.h1+'\nMetodología de la Investigación Social · Módulo cualitativo · Bachillerato en Ciencias Sociales, UFRO\n'+(r&&r.name?('Estudiante: '+r.name+'\n'):'')+'Fecha: '+new Date().toLocaleDateString('es-CL')+'\n\n';
  Q.forEach(function(q,i){
    var s=s4(q.id);
    t+='==== Pregunta '+(i+1)+' · '+q.tag+' ====\n'+q.ask+'\n\nMI RESPUESTA:\n'+(s.text||'(sin respuesta)')+'\n\n';
    if(s.self&&s.self.length)t+='AUTOEVALUACIÓN:\n'+q.incl.map(function(x,k){return (k+1)+'. '+({si:'Lo incluí',parte:'En parte',no:'No lo incluí'}[s.self[k]]||'sin marcar')+' — '+x}).join('\n')+'\n\n';
    if(s.rev)t+='AJUSTES QUE HARÍA:\n'+s.rev+'\n\n';
  });
  var blob=new Blob([t],{type:'text/plain;charset=utf-8'}),a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download='mis_respuestas_presentacion_'+META.num+'.txt';document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},500);
}

/* ---------- Render y eventos ---------- */
function render(){
  paintWho();
  if(view.name==='home')vHome();else if(view.name==='m1')vM1();else if(view.name==='m2')vM2();else if(view.name==='m3')vM3();else vM4();
}
var saveT;
app.addEventListener('input',function(e){
  var t=e.target;
  if(t.hasAttribute('data-ta')){
    var s=s4(t.getAttribute('data-ta'));s.text=t.value;var w=words(t.value);
    var wc=$('#wc');if(wc)wc.textContent=w;var b=$('#stg');if(b)b.disabled=w<MINW;
    clearTimeout(saveT);saveT=setTimeout(save,400);
  }else if(t.hasAttribute('data-rv')){
    s4(t.getAttribute('data-rv')).rev=t.value;clearTimeout(saveT);saveT=setTimeout(save,400);
  }
});
app.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');if(!el||el.disabled)return;
  var a=el.getAttribute('data-act'),i=parseInt(el.getAttribute('data-i'),10),v=el.getAttribute('data-v');
  if(a==='open')go(el.getAttribute('data-k'),0);
  else if(a==='ask'){view.ask=true;render();var rn=$('#rst-no');if(rn){rn.focus();rn.scrollIntoView({block:'center'})}}
  else if(a==='rst-no'){view.ask=false;render()}
  else if(a==='rst-yes')resetAll();
  else if(a==='home')go('home');
  else if(a==='tab'){view.tab=i;view.sel=null;view.chk={};render();window.scrollTo(0,0)}
  else if(a==='reveal'){ST.m1[el.getAttribute('data-id')]=true;save();if(momDone('m1'))report();render()}
  else if(a==='chip')onChip(B[view.tab],el.getAttribute('data-id'));
  else if(a==='slot')onSlot(B[view.tab],el.getAttribute('data-slot'));
  else if(a==='check')onCheck(B[view.tab]);
  else if(a==='solve')onSolve(B[view.tab]);
  else if(a==='reset')onReset(B[view.tab]);
  else if(a==='ans')onAns(i,parseInt(v,10));
  else if(a==='again'){var st=s3(D[view.tab].id);st.ans=[];st.tries++;save();render();window.scrollTo(0,0)}
  else if(a==='starter'){var q=Q[view.tab],s=s4(q.id);if(!s.text){s.text=q.starter+' ';save();render();var ta=$('#ta');if(ta){ta.focus();ta.setSelectionRange(ta.value.length,ta.value.length)}}}
  else if(a==='stage'){var s=s4(Q[view.tab].id);s.stage=1;save();render()}
  else if(a==='self'){var s=s4(Q[view.tab].id);s.self[i]=v;save();render()}
  else if(a==='variant'){var s=s4(Q[view.tab].id);s.variant=i;s.refOpen=true;save();render()}
  else if(a==='refsum'){var s=s4(Q[view.tab].id);s.refOpen=!s.refOpen}
  else if(a==='finish'){var q=Q[view.tab],s=s4(q.id);s.done=true;s.ts=Date.now();save();report();toast('Pregunta completada y guardada.');render()}
  else if(a==='dl')descargar();
});
render();
histFlush();
window.addEventListener('storage',function(e){if(e.key===KEYS.mod&&e.newValue===null){ST=freshST();go('home')}});
window.__PRES={ST:function(){return ST},DATA:DATA,go:go};
})();

</script>
