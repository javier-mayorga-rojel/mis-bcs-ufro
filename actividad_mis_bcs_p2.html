  PIN DOCENTE: CUALITATIVO2026 (lo pide solo dashboard_docente.html; este archivo no pide PIN)
  Estado compartido con el portal (localStorage, mismo origen): lee mis_bcs_reg y mis_bcs_theme; escribe mis_bcs_prog.p2 = {done: momentos completados de 4, pts: 0} y su estado propio en mis_bcs_p2.
  Sin puntaje: el avance se mide en momentos completados.
  Firebase: se configura una sola vez en firebase_config.js (mismo archivo para todo el sitio). Mientras diga "REEMPLAZAR", usa solo localStorage. Un proyecto Realtime Database (no Firestore).
    Nodo que se escribe: mis_bcs/p2/<id del estudiante o grupo> (se actualiza al completar un cuadro, un conjunto o una pregunta, y al terminar el recorrido).
    Incluye los TEXTOS que escribe el estudiante en las preguntas de desarrollo: avisarles que su docente los recibirá.
    Reinicio: «Borrar mi avance y empezar de nuevo» guarda antes una copia del avance en mis_bcs_hist (local) y, con Firebase activo,
    en mis_bcs_hist/p2/<id>/<clave> (solo se agrega, no se sobrescribe) y marca mis_bcs/p2/<id>/ultimoReinicio. El panel docente lee ese historial.
    Reglas sugeridas (producción): { "rules": { ".write": true, ".read": "auth != null" } }. En pruebas, lectura abierta; no usar con datos reales de estudiantes.
    Pasos: console.firebase.google.com > crear proyecto > Realtime Database > registrar app web > copiar firebaseConfig > pegar aquí y subir el archivo al repositorio (nunca subir claves reales a un repositorio público sin revisar las reglas).
-->
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Presentación 2 · Perspectivas y fundamentos según Flick</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,500&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
/* Concepto: un módulo de estudio sobrio, de una sola columna. Cada sección tiene su color; el mapa del modelo vive dentro de la Sección 1. */
:root{
  --bg:#f8f5ef; --surface:#fffdf8; --ink:#0b1a33; --ink2:#4b566b; --line:#d9d0ba;
  --gold:#c9a256; --gold-ink:#7d5f17; --gold-bg:#f3e8cc; --nav:#0b1a33; --nav-ink:#f8f5ef;
  --teo:#1a4a7a; --teo-bg:#e6eef7; --emp:#1a5c38; --emp-bg:#e4f1e9;
  --ok:#1a5c38; --ok-bg:#ebf7ef; --no:#9b2226; --no-bg:#fdeeee; --info:#1a4a7a; --info-bg:#eaf1f9;
  --s0c:#1a4a7a; --s0b:#e8f0f8; --s1c:#7a3b1e; --s1b:#faf0e8; --s2c:#1a5c38; --s2b:#e8f5ee; --s3c:#4a1a6b; --s3b:#f0e8f8;
  --focus:#0b1a33;
  --ff-d:'Playfair Display',Georgia,'Times New Roman',serif;
  --ff-b:'Source Serif 4',Georgia,'Times New Roman',serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0a1428; --surface:#111f3a; --ink:#f1ece0; --ink2:#aab4c6; --line:#2a3a5c;
    --gold:#e0bd73; --gold-ink:#e0bd73; --gold-bg:#3a3118; --nav:#060d1c; --nav-ink:#f1ece0;
    --teo:#7fb0e6; --teo-bg:#14284a; --emp:#6fcb98; --emp-bg:#12332a;
    --ok:#6fcb98; --ok-bg:#10301f; --no:#f19a9d; --no-bg:#3a1618; --info:#8fbbea; --info-bg:#14284a;
    --s0c:#8fbbea; --s0b:#14284a; --s1c:#e8a985; --s1b:#3a2216; --s2c:#6fcb98; --s2b:#12332a; --s3c:#c9a0e8; --s3b:#2c1a42;
    --focus:#e0bd73; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0a1428; --surface:#111f3a; --ink:#f1ece0; --ink2:#aab4c6; --line:#2a3a5c;
  --gold:#e0bd73; --gold-ink:#e0bd73; --gold-bg:#3a3118; --nav:#060d1c; --nav-ink:#f1ece0;
  --teo:#7fb0e6; --teo-bg:#14284a; --emp:#6fcb98; --emp-bg:#12332a;
  --ok:#6fcb98; --ok-bg:#10301f; --no:#f19a9d; --no-bg:#3a1618; --info:#8fbbea; --info-bg:#14284a;
  --s0c:#8fbbea; --s0b:#14284a; --s1c:#e8a985; --s1b:#3a2216; --s2c:#6fcb98; --s2b:#12332a; --s3c:#c9a0e8; --s3b:#2c1a42;
  --focus:#e0bd73; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--ff-b);font-size:17px;line-height:1.6;margin:0;padding:0}
button{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px;border-radius:6px}
.wrap{max-width:960px;margin:0 auto;padding-inline:16px}

/* Barra superior */
.top{background:var(--nav);color:var(--nav-ink)}
.top .wrap{display:flex;align-items:center;gap:14px;min-height:60px;flex-wrap:wrap;padding-block:8px}
.top a.back{display:inline-flex;align-items:center;gap:8px;text-decoration:none;font-weight:600;font-size:15px;color:var(--nav-ink);padding:6px 10px;border-radius:8px;border:1px solid rgba(248,245,239,.28)}
.top a.back:hover{border-color:var(--gold)}
.top .ttl{font-family:var(--ff-d);font-weight:600;font-size:16px;flex:1;min-width:0;line-height:1.25}
.top .ttl small{display:block;font-family:var(--ff-b);font-weight:400;font-size:13px;opacity:.75}
.top .who{font-size:14px;padding:4px 12px;border:1px solid rgba(248,245,239,.28);border-radius:999px;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbtn{width:38px;height:38px;border-radius:50%;border:1px solid rgba(248,245,239,.28);background:none;color:var(--nav-ink);cursor:pointer;display:grid;place-items:center}
.tbtn:hover{border-color:var(--gold)}
@media (max-width:560px){.top .ttl small{display:none}.top .who{max-width:120px}}

/* Aviso de identificación */
.note{margin-top:18px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 16px;border-radius:12px;background:var(--gold-bg);border:1px solid var(--gold);font-size:15px}
.note a,.note button{font-weight:600}
.note button{background:none;border:0;padding:0;text-decoration:underline;cursor:pointer}
.note a.cta{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:999px;background:var(--ink);color:var(--bg);text-decoration:none;font-weight:700;box-shadow:0 2px 0 var(--gold)}
.note a.cta:hover{filter:brightness(1.12)}

/* Inicio */
.hero{padding-block:36px 8px}
.eyebrow{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-ink);font-weight:600;margin:0 0 8px}
h1{font-family:var(--ff-d);font-weight:700;font-size:clamp(30px,5.5vw,46px);line-height:1.12;margin:0 0 12px;text-wrap:balance}
.lead{font-size:18px;color:var(--ink2);max-width:680px;margin:0}
h2.sec-t{font-family:var(--ff-d);font-size:26px;margin:36px 0 14px;line-height:1.2}
.goals{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px;max-width:720px}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:6px}
.how div{border-top:3px solid var(--ink);padding-top:10px}
.how b{font-family:var(--ff-d);font-size:19px;display:block;margin-bottom:2px}
.how span{color:var(--ink2);font-size:15.5px}
.total{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:28px;padding:16px 18px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.total .big{font-family:var(--ff-d);font-weight:700;font-size:30px;line-height:1}
.total small{color:var(--ink2);font-size:15px}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;flex:1;min-width:140px}
.bar i{display:block;height:100%;background:var(--gold);border-radius:4px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.card .hd{background:var(--bg-c);color:var(--c);padding:16px 18px;display:flex;gap:12px;align-items:flex-start}
.card .num{flex:none;width:36px;height:36px;border-radius:50%;background:var(--c);color:var(--bg-c);display:grid;place-items:center;font-family:var(--ff-d);font-weight:700}
.card h3{font-family:var(--ff-d);font-size:20px;line-height:1.2;margin:2px 0 0}
.card .bd{padding:14px 18px 18px;display:flex;flex-direction:column;gap:12px;flex:1}
.card p{margin:0;font-size:15.5px;color:var(--ink2)}
.card .meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:var(--ink2)}
.card .meta b{color:var(--ink)}
.tagst{font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--ink2);margin-left:auto;white-space:nowrap}
.tagst.done{border-color:var(--ok);color:var(--ok)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:10px;padding:11px 18px;font-weight:600;cursor:pointer;background:var(--ink);color:var(--bg);text-decoration:none;font-size:16px}
.btn.alt{background:none;color:var(--ink);border:1px solid var(--ink)}
.btn.gold{background:var(--gold);color:#0b1a33}
.btn:hover{filter:brightness(1.08)}
.btn[disabled]{opacity:.4;cursor:default}
.card .btn{margin-top:auto;align-self:flex-start}

/* Sección */
.stepper{display:flex;gap:6px;flex-wrap:wrap;margin-top:22px}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:15px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.pill i{font-style:normal;font-size:12px;color:var(--ink2)}
.pill[aria-current="true"]{background:var(--c);color:var(--bg-c);border-color:var(--c)}
.pill[aria-current="true"] i{color:var(--bg-c)}
.pill.done i{color:var(--ok)}
.pill[aria-current="true"].done i{color:var(--bg-c)}
.sechd{margin-top:22px;border-radius:14px;background:var(--bg-c);color:var(--c);padding:22px 22px 20px;border:1px solid var(--c)}
.sechd .k{font-size:13px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;margin:0 0 6px}
.sechd h2{font-family:var(--ff-d);font-size:clamp(24px,4vw,32px);line-height:1.18;margin:0 0 10px}
.sechd p.d{margin:0;color:var(--ink);font-size:17px}
.sechd .g{margin:10px 0 0;font-size:14.5px;color:var(--ink2)}
.blk{margin-top:30px}
.blk > h3{font-family:var(--ff-d);font-size:21px;margin:0 0 4px}
.blk > p.sub{margin:0 0 14px;color:var(--ink2);font-size:15.5px}
.cloud{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:baseline}
.chip{border:1px solid var(--c);background:var(--surface);color:var(--c);border-radius:999px;padding:5px 14px;cursor:pointer;font-weight:600;line-height:1.3}
.chip[aria-pressed="true"]{background:var(--c);color:var(--bg-c)}
.def{margin-top:14px;padding:14px 16px;border-radius:12px;background:var(--bg-c);border-left:4px solid var(--c)}
.def b{font-family:var(--ff-d);font-size:18px;color:var(--c);display:block;margin-bottom:2px}
.def p{margin:0}
details.map{border:1px solid var(--line);border-radius:14px;background:var(--surface);margin-top:26px}
details.map > summary{cursor:pointer;padding:14px 18px;font-family:var(--ff-d);font-size:19px;font-weight:600;list-style:none;display:flex;gap:10px;align-items:center}
details.map > summary::-webkit-details-marker{display:none}
details.map > summary::before{content:"";width:9px;height:9px;border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:rotate(-45deg);transition:transform .15s;flex:none}
details.map[open] > summary::before{transform:rotate(45deg)}
details.map > summary small{font-family:var(--ff-b);font-weight:400;font-size:14.5px;color:var(--ink2);margin-left:auto}
details.map .inner{padding:4px 16px 18px}
.prog{display:flex;align-items:center;gap:12px;margin:26px 0 0;padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);position:sticky;top:0;z-index:5}
.prog .bar i{background:var(--c)}
.prog span{font-size:15px;white-space:nowrap}

/* Ítems */
.q{padding:18px 0;border-bottom:1px solid var(--line)}
.q:last-child{border-bottom:0}
.q .qt{font-weight:600;margin:0 0 12px}
.q .qn{color:var(--c);font-family:var(--ff-d);margin-right:6px}
.frag{margin:0 0 12px;padding:10px 14px;border-left:4px solid var(--c);background:var(--bg-c);border-radius:0 10px 10px 0;font-style:italic}
.fq{margin:0 0 10px;font-size:15.5px;color:var(--ink2)}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;cursor:pointer;display:flex;gap:10px;align-items:flex-start;line-height:1.45}
.opt:hover:not([disabled]){border-color:var(--c)}
.opt .l{font-weight:700;color:var(--c);flex:none}
.opt[disabled]{cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--no);background:var(--no-bg)}
.opt.dim{opacity:.62}
.pair{display:flex;gap:10px;flex-wrap:wrap}
.pair .opt{flex:1 1 200px;justify-content:center;align-items:center;text-align:center;font-weight:600}
.fb{margin-top:12px;padding:12px 14px;border-radius:10px;font-size:16px;line-height:1.55;display:flex;gap:12px;align-items:flex-start}
.fb.ok{background:var(--ok-bg);border:1px solid var(--ok)}
.fb.no{background:var(--info-bg);border:1px solid var(--info)}
.fb svg{flex:none;margin-top:3px}
.fb.ok svg{color:var(--ok)} .fb.no svg{color:var(--info)}
.fb p{margin:0}
.fb .ref{display:block;margin-top:6px;font-size:14px;color:var(--ink2)}
.fb .ref b{color:var(--ink)}

/* Resultado */
.res{margin-top:34px;border:2px solid var(--c);border-radius:16px;background:var(--surface);padding:22px}
.res h3{font-family:var(--ff-d);font-size:24px;margin:0 0 4px}
.res .score{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:6px 0 10px}
.res .score b{font-family:var(--ff-d);font-size:44px;line-height:1;color:var(--c)}
.res .brk{display:flex;gap:8px 18px;flex-wrap:wrap;color:var(--ink2);font-size:15px;margin:0 0 12px}
.res .rev{margin:14px 0 0;padding:12px 16px;border-radius:12px;background:var(--bg-c)}
.res .rev b{display:block;margin-bottom:4px}
.res .rev ul{margin:0;padding-left:20px}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}

footer{margin-top:56px;background:var(--nav);color:var(--nav-ink)}
footer .wrap{padding-block:32px}
footer .f-n{margin:0;font:700 17px/1.3 var(--ff-d)}
footer .f-s{margin:6px 0 0;font-size:14.5px;line-height:1.6;opacity:.82;max-width:60ch}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;font-size:15px;z-index:50;max-width:calc(100% - 32px)}

.reset{margin-top:36px;padding-top:20px;border-top:1px solid var(--line)}
.reset .btn.alt{font-size:15px;padding:9px 16px}
.reset-box{padding:16px 18px;border:1px solid var(--no);border-radius:12px;background:var(--no-bg)}
.reset-box p{margin:0 0 6px;line-height:1.55}
.btn.danger{background:var(--no);color:var(--bg)}

/* ===== Presentación: estaciones, cuadros, clasificación y desarrollo ===== */
.muted{color:var(--ink2);font-size:15px}
.stt{font-family:var(--ff-d);font-size:23px;line-height:1.25;margin:0 0 12px}
.before{margin:0 0 16px;padding:14px 16px;border:1px dashed var(--c);border-radius:12px;background:var(--surface)}
.before p{margin:0 0 10px}
.before .btn{margin-top:4px}
dl.items{margin:6px 0 0}
dl.items dt{font-weight:600;color:var(--c);margin-top:14px;font-family:var(--ff-d);font-size:18px}
dl.items dd{margin:2px 0 0;max-width:760px}
.conn{margin-top:18px;padding:12px 16px;border-left:4px solid var(--gold);background:var(--gold-bg);border-radius:0 12px 12px 0}
.conn b{display:block;margin-bottom:2px}
.conn p,.conn ul{margin:0}
.conn ul{padding-left:20px}
.doneline{margin:12px 0 0;color:var(--ok);font-weight:600}
.pc{border:1px solid var(--c);background:var(--surface);color:var(--ink);border-radius:10px;padding:9px 13px;text-align:left;cursor:pointer;line-height:1.4;font-size:15.5px}
.pc:hover{background:var(--bg-c)}
.pc[aria-pressed="true"]{outline:3px solid var(--gold);outline-offset:1px;background:var(--gold-bg)}
.pc.ok{border-color:var(--ok);background:var(--ok-bg)}
.pc.no{border-color:var(--no);background:var(--no-bg)}
.pieces{display:flex;flex-wrap:wrap;gap:8px}
.bank{margin-top:22px;display:grid;gap:16px;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.bank h5{margin:0 0 8px;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2);font-weight:600}
.slot{width:100%;min-height:58px;border:2px dashed var(--line);border-radius:10px;background:var(--bg);padding:9px 12px;text-align:left;cursor:pointer;color:var(--ink);line-height:1.4;font-size:15.5px}
.slot .ph{color:var(--ink2);font-size:14.5px}
.slot.target{border-color:var(--gold)}
.slot.has{border-style:solid;border-color:var(--c);background:var(--surface)}
.slot.ok{border-color:var(--ok);background:var(--ok-bg)}
.slot.no{border-color:var(--no);background:var(--no-bg)}
.boxes{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:14px}
.bx{border:2px solid var(--c);border-radius:12px;background:var(--bg-c);padding:12px}
.bx h4{margin:0 0 10px;font-family:var(--ff-d);font-size:18px;color:var(--c);line-height:1.25}
.slotlist{display:flex;flex-direction:column;gap:8px}
.gridb{display:grid;gap:12px}
.grow{display:grid;grid-template-columns:minmax(110px,.55fr) repeat(var(--nc),minmax(0,1fr));gap:10px;align-items:stretch}
.grow .rl{font-family:var(--ff-d);font-weight:700;color:var(--c);padding:8px 4px;display:flex;align-items:center;line-height:1.25}
.ghead{position:static}
.chd{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);font-weight:600;align-self:end}
.clab{display:none;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);margin-bottom:4px}
.cell{display:flex;flex-direction:column}
.cell .slot{flex:1}
@media (max-width:760px){
  .grow{grid-template-columns:minmax(0,1fr);padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
  .ghead{display:none}
  .clab{display:block}
}
.q .opts{gap:8px}
textarea{width:100%;min-height:200px;font:inherit;line-height:1.55;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);resize:vertical}
textarea.short{min-height:110px}
.tl{display:block;font-weight:600;margin:18px 0 6px}
.cnt{margin:6px 0 0;color:var(--ink2);font-size:14.5px}
ol.incl{margin:0 0 10px;padding-left:22px;display:flex;flex-direction:column;gap:6px}
.self{display:flex;flex-direction:column;gap:12px}
.selfrow{padding-bottom:12px;border-bottom:1px solid var(--line)}
.selfrow p{margin:0 0 8px}
.selfrow .qn{color:var(--c);font-family:var(--ff-d);margin-right:6px;font-weight:700}
.tri{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.tri button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;cursor:pointer;font-size:15px}
.tri button[aria-pressed="true"]{background:var(--c);color:var(--bg-c);border-color:var(--c)}
details.refbox{margin-top:18px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
details.refbox > summary{cursor:pointer;padding:12px 16px;font-family:var(--ff-d);font-weight:600;font-size:18px}

<script>
(function(){
var PREVIEW=false;
var DATA={"meta": {"id": "p2", "num": 2, "eyebrow": "Presentación 2", "h1": "Perspectivas y fundamentos según Flick", "lead": "Estudia la presentación de la clase en cuatro momentos: recorrido guiado, cuadros por completar, ejemplos por clasificar y preguntas de desarrollo. No tiene puntaje: cada momento que terminas queda marcado como completado.", "goals": ["Explicar por qué el método, el problema y el proceso se comprenden juntos, y qué lugar ocupa la teoría en las estrategias deductiva e inductiva.", "Reconocer los límites que Flick atribuye al modelo cuantitativo tradicional y las tres soluciones ante la complejidad del objeto.", "Distinguir los rasgos de la investigación cualitativa (reflexividad, perspectivas de los participantes) y aplicarlos al ejemplo de los trastornos mentales y a las Lecturas 1 y 3."]}, "mom": [{"id": "m1", "title": "Recorrido guiado", "desc": "Recorre las láminas por estaciones. Antes de ver cada una, piensa tu respuesta; luego compárala con lo que muestra la lámina.", "meta": "7 estaciones · ≈ 30 min"}, {"id": "m2", "title": "Completar el cuadro", "desc": "Reconstruye tres cuadros de la presentación colocando cada pieza en su lugar. Puedes comprobar y corregir cuantas veces quieras.", "meta": "3 cuadros · ≈ 15 min"}, {"id": "m3", "title": "Distinguir y comparar", "desc": "Clasifica descripciones y ejemplos del texto según las categorías de la presentación. Recibes la explicación y dónde repasar.", "meta": "3 conjuntos de ejemplos · ≈ 15 min"}, {"id": "m4", "title": "Desarrollo guiado", "desc": "Responde tres preguntas con tus propias palabras: orientaciones antes de escribir y una autoevaluación después.", "meta": "3 preguntas · ≈ 30 min"}], "S": [{"id": "e1", "title": "Método, problema y proceso", "slides": "Láminas 2 y 3", "prompt": "Antes de ver las láminas: ¿por qué no se puede elegir un método cualitativo sin saber cuál es el problema que se investiga?", "items": [["Tres ideas de partida (lámina 2)", "existe una gran variedad de métodos y cada uno parte de premisas y propósitos distintos; cada método se basa en una comprensión específica de su objeto; los métodos cualitativos no se pueden considerar independientemente del proceso de investigación ni del problema en estudio."], ["Problema, método y proceso", "la lámina los dibuja como un triángulo: se comprenden juntos. Su finalidad es elegir la estrategia más apropiada a la pregunta y a los problemas de investigación."], ["Lámina 3 · Del problema a los casos", "se parte de preguntas generales y luego específicas, y se seleccionan conceptos, con apoyo de los objetivos de la investigación y la revisión de literatura (que conducen a hipótesis); después se identifican y seleccionan los casos."], ["Selección de casos y de métodos", "al seleccionar los casos se consideran la realidad social construida y los marcos de referencia de los actores sociales, y que los casos reúnan condiciones, respondan las preguntas, operacionalicen y sean aplicables y factibles. Luego se seleccionan los métodos."], ["Evaluación y reformulación", "se evalúan y reformulan las preguntas de investigación con capacidad reflexiva y crítica (posición epistemológica, proceso y evaluación de avances)."], ["Producción y análisis de los datos", "la producción de datos entrega la evidencia empírica y tiene una lógica de producción que relaciona sujetos y preguntas; luego viene el análisis de los datos. En ambos pasos se usan métodos."], ["Formulación de los resultados", "la construcción de los resultados considera las preguntas y la discusión, la lógica de producción y las formas de presentación."]], "conn": "Lectura 2 (Flick), introducción del capítulo: los métodos cualitativos no se pueden considerar independientemente del proceso de investigación y del problema en estudio. Lectura 3 (Ragin, cap. 4), apartado «El proceso de investigación cualitativa»: Ragin lo describe como un proceso con frecuencia menos estructurado y flexible; el investigador selecciona casos y lugares, identifica conceptos guía, aclara conceptos y categorías durante el estudio y puede terminar elaborando marcos analíticos. Compáralo con la secuencia de la lámina 3."}, {"id": "e2", "title": "De la falta de familiaridad a las estrategias inductivas", "slides": "Láminas 4 a 7", "prompt": "Antes de ver las láminas: si no conoces lo que ocurre en un ámbito social, ¿puedes partir de una teoría para comprobarla?", "items": [["1. Falta de familiaridad", "el punto de partida del científico social es, prácticamente siempre, no conocer lo que ocurre realmente en la esfera de vida estudiada (Blumer, citado por Flick)."], ["2. Contextos nuevos", "el cambio social y la diversificación de los mundos vitales enfrentan a los investigadores con contextos y perspectivas nuevos."], ["3. La deducción no diferencia los objetos", "derivar preguntas e hipótesis de modelos teóricos y ponerlas a prueba no logra diferenciar los objetos."], ["4. Estrategias inductivas", "la investigación se ve forzada, cada vez más, a usarlas."], ["Lámina 5 · Estrategia deductiva", "punto de partida: modelos teóricos, de los que se derivan las preguntas de investigación y las hipótesis. Relación con los datos: las hipótesis se ponen a prueba frente a los datos empíricos. Valoración de Flick: en contextos nuevos, no logra diferenciar los objetos."], ["Lámina 5 · Estrategia inductiva", "punto de partida: conceptos sensibilizadores, que permiten enfocar los contextos sociales que deben estudiarse. Relación con los datos: las teorías se desarrollan a partir de estudios empíricos. Valoración de Flick: cada vez más necesaria."], ["La diferencia entre ambas", "no está en que una use teoría y la otra no, sino en el lugar que ocupa la teoría: se pone a prueba o se desarrolla."], ["Lámina 6 · Conceptos sensibilizadores", "orientan la mirada hacia los contextos sociales que deben estudiarse, en lugar de partir de teorías para comprobarlas; el conocimiento y la práctica se estudian como locales (Geertz). Un error extendido es creer que están libres de conocimiento teórico previo; Flick lo corrige: están influidos por él, pero aquí las teorías se desarrollan a partir de estudios empíricos."], ["Lámina 7 · Ejercicio", "elige un contexto social poco familiar y responde: qué podrías afirmar a partir de hipótesis previas y qué desconoces realmente; qué necesitarías mirar primero para orientar tu observación sin partir de una teoría que quieras comprobar; qué conocimiento teórico previo influye igualmente en tu mirada aunque no lo declares."]], "conn": "Lectura 1 (Ragin, cap. 3), apartado «Procesos y estrategias de la investigación social»: los marcos analíticos fijos son muchas veces necesarios en estudios que pretenden comprobar la validez de las teorías, mientras que en otras investigaciones los marcos son flexibles o fluidos y cambian durante el estudio. Lectura 3 (Ragin, cap. 4), «El proceso de investigación cualitativa»: Ragin habla de «conceptos guía» y la nota de la traducción indica que el término original es «sensitizing concepts», de Blumer."}, {"id": "e3", "title": "Rasgos de lo cualitativo y conveniencia de métodos y teorías", "slides": "Láminas 8 a 10", "prompt": "Antes de ver las láminas: ¿puede un método estándar decidir qué objetos merecen estudiarse?", "items": [["Lámina 8 · Rasgos esenciales", "la elección correcta de métodos y teorías apropiados, el reconocimiento y el análisis de perspectivas diferentes, las reflexiones de los investigadores sobre su investigación como parte del proceso de producción de conocimiento, y la variedad de enfoques y métodos."], ["Bortz y la conveniencia de las ideas", "el texto recoge que, para Bortz, deben escogerse solo las ideas de investigación que puedan estudiarse empíricamente; entre las que no encajarían menciona las de contenido filosófico, las que usan conceptos imprecisos, las que estudian personas o situaciones especiales y las que buscan la relevancia causal de rasgos aislados."], ["Lámina 9 · La objeción de Flick", "tiene sentido preguntarse si un problema puede estudiarse empíricamente, pero Flick no comparte el criterio de Bortz para juzgar el objeto. Existen personas y situaciones excepcionales, aunque no necesariamente en número suficiente para justificar una muestra cuantificadora y hallazgos generalizables. Y que la mayoría de los fenómenos no puedan explicarse aislados es resultado de la complejidad de la realidad y de los fenómenos, y no de un defecto de los objetos (así lo plantea la lámina)."], ["Lámina 10 · 1.ª solución: excluir la complejidad (Bortz)", "diseñar los estudios solo según el modelo de relaciones claras de causa-efecto. Se pierden los objetos complejos: habría que excluirlos todos."], ["Lámina 10 · 2.ª solución: incorporar la complejidad", "los diseños cuantitativos complejos consideran las condiciones contextuales (por ejemplo, el análisis multinivel) y comprenden los modelos empírica y estadísticamente. Subsiste el «problema básico»: solo se muestra lo que ya abarca el modelo subyacente de la realidad, y es más difícil reintroducir los hallazgos en lo cotidiano."], ["Lámina 10 · 3.ª solución: abrir los métodos", "la investigación cualitativa diseña métodos tan abiertos que hagan justicia a la complejidad del objeto, estudiado en su totalidad y en su contexto cotidiano. En este pasaje el texto no señala pérdida ni problema subsistente."]], "conn": "Lectura 1 (Ragin, cap. 3), apartado «Pruebas empíricas»: los científicos sociales no se limitan a los datos de las encuestas y, de hecho, muchos de los fenómenos que se estudian no pueden abordarse con cuestionarios."}, {"id": "e4", "title": "El modelo cuantitativo tradicional y sus límites", "slides": "Láminas 11 a 13", "prompt": "Antes de ver las láminas: ¿qué le pedía la ciencia social tradicional a un buen estudio y qué no logró cumplir?", "items": [["Lámina 11 · Propósitos", "aislar causas y efectos, operacionalizar relaciones teóricas, medir y cuantificar los fenómenos, y generalizar hallazgos y formular leyes generales."], ["Lámina 11 · Procedimientos de diseño", "muestras aleatorias para asegurar la representatividad, clasificar por frecuencia y distribución, controlar las condiciones hasta donde sea posible y estándares obligatorios generales."], ["Lámina 11 · Garantías de objetividad", "excluir al máximo la influencia del investigador y eliminar en gran parte las opiniones subjetivas del investigador y de las personas investigadas."], ["Lámina 12 · Los ideales de objetividad no se satisfacen del todo", "la lámina habla de un considerable desencanto con esos ideales (Weber; Bonß y Hartmann). La práctica de la investigación muestra que gran parte de los ideales formulados con antelación no puede satisfacerse: a pesar de los controles metodológicos, intervienen inevitablemente los intereses y el trasfondo social y cultural de las personas implicadas, y esos factores influyen en la formulación de las preguntas e hipótesis y en la interpretación de los datos y de las relaciones."], ["Lámina 13 · El objeto determina el método", "según Flick, el objeto en estudio es el factor determinante para escoger un método, y no al revés. Los objetos no se reducen a variables individuales: se estudian en su complejidad y totalidad en su contexto cotidiano. Los campos de estudio son las prácticas e interacciones de la vida cotidiana, con frecuencia situaciones y personas excepcionales; los métodos se caracterizan por su apertura hacia sus objetos; y la meta es menos examinar lo que ya se conoce bien y más descubrir lo nuevo y desarrollar teorías fundamentadas empíricamente."]], "conn": "Lectura 1 (Ragin, cap. 3), apartado «Introducción»: un investigador que vive con un grupo pequeño de soldados y otro que encuesta a muchos soldados con una muestra aleatoria construyen representaciones muy diferentes de lo que significa ser soldado; en ambos hay un diálogo entre ideas y pruebas empíricas, pero muy distinto."}, {"id": "e5", "title": "Reflexividad: el investigador como parte del proceso", "slides": "Láminas 14 y 15", "prompt": "Antes de ver las láminas: ¿qué hace un estudio cualitativo con las impresiones y los sentimientos de quien investiga?", "items": [["Lámina 14 · Poder de reflexión", "a diferencia de la investigación cuantitativa, los métodos cualitativos toman la comunicación del investigador con el campo y sus miembros como una parte explícita de la producción de conocimiento, en lugar de excluirla lo más posible como una variable parcialmente responsable."], ["Subjetividades", "las subjetividades del investigador y de aquellos a los que se estudia son parte del proceso de investigación."], ["Datos de propio derecho", "las reflexiones sobre las acciones y observaciones en el campo, las impresiones, los accesos de irritación y los sentimientos se convierten en datos de propio derecho y forman parte de la interpretación."], ["Lámina 15 · Contraste", "la investigación cuantitativa excluye lo más posible la comunicación del investigador con el campo; la cualitativa la incorpora como parte del conocimiento."], ["Cómo se documentan", "en diarios de investigación o protocolos de contexto."]], "conn": "Lectura 1 (Ragin, cap. 3), apartado «Marcos analíticos»: sin el marco adecuado, los investigadores pueden estar ciegos frente a ciertas manifestaciones; el marco es una forma de observar. Compáralo con la reflexión sobre la propia mirada."}, {"id": "e6", "title": "Perspectivas de los participantes: el ejemplo de los trastornos mentales", "slides": "Láminas 16 a 19", "prompt": "Antes de ver las láminas: una correlación entre clase social y trastornos mentales, ¿qué deja sin responder?", "items": [["Lámina 16 · La idea que une el ejemplo", "Flick lo usa para explicar otro rasgo de la investigación cualitativa: las perspectivas de los participantes y su diversidad. Los puntos de vista y las prácticas en el campo son diferentes a causa de las distintas perspectivas subjetivas y de los ambientes sociales."], ["Lámina 17 · Lo que muestra la epidemiología", "los estudios epidemiológicos muestran la frecuencia de la esquizofrenia en la población y cómo varía su distribución: en las clases sociales bajas, los trastornos mentales graves ocurren con mucha más frecuencia que en las altas (correlación hallada por Hollingshead y Redlich y confirmada repetidamente)."], ["Lámina 18 · Dirección de la correlación", "no se pudo clarificar si las condiciones de vida de una clase social baja promueven la aparición de los trastornos, o si las personas con problemas mentales se dejan caer hacia las clases bajas (Keupp)."], ["Lámina 18 · Significado y perspectivas", "los hallazgos no aportan nada sobre lo que significa vivir con la enfermedad mental, sobre el significado subjetivo de la enfermedad (o de la salud) para las personas directamente relacionadas ni sobre la diversidad de perspectivas en el contexto de esas personas."], ["Lámina 19 · Las preguntas cualitativas", "(1) el significado subjetivo de la esquizofrenia para el paciente y para sus familiares; (2) cómo hacen frente a la enfermedad las personas implicadas en su vida actual; (3) qué originó el comienzo de la enfermedad y qué la hizo crónica; (4) la influencia de las instituciones que han tratado al paciente; (5) las ideas, metas y rutinas que guían su terapia concreta."], ["Lámina 19 · Qué hace la investigación cualitativa", "muestra la variedad de perspectivas (paciente, familiares, profesionales); estudia el conocimiento y las prácticas de los participantes; analiza las interacciones en un campo particular; y describe y explica las interrelaciones en el contexto concreto del caso."]], "conn": "Lectura 3 (Ragin, cap. 4), apartado «Introducción»: las visiones panorámicas resumen en un porcentaje o una estadística la información de muchos casos, pero no dicen nada acerca de los casos individuales. Compáralo con lo que la epidemiología deja sin responder."}, {"id": "e7", "title": "Síntesis: cuantitativa tradicional y cualitativa", "slides": "Lámina 20", "prompt": "Antes de ver la lámina: ¿en qué aspectos compararías los dos enfoques?", "items": [["Punto de partida", "cuantitativa tradicional: modelos teóricos e hipótesis a contrastar. Cualitativa (según Flick): conceptos sensibilizadores; teorías desarrolladas a partir de estudios empíricos."], ["Objeto y método", "cuantitativa tradicional: se juzga el objeto según los métodos disponibles (Bortz). Cualitativa: el objeto determina el método."], ["Objeto de estudio", "cuantitativa tradicional: causas y efectos aislados; fenómenos medidos. Cualitativa: objetos en su complejidad y totalidad, en su contexto cotidiano."], ["Rol del investigador", "cuantitativa tradicional: influencia excluida al máximo. Cualitativa: comunicación con el campo y subjetividades como parte del conocimiento."], ["Meta", "cuantitativa tradicional: generalizar hallazgos y formular leyes generales. Cualitativa: descubrir lo nuevo y desarrollar teorías fundamentadas empíricamente."], ["Calidad", "cuantitativa tradicional: criterios académicos abstractos; objetividad. Cualitativa: fundamento empírico, adecuación del método al objeto, relevancia y poder de reflexión."]], "conn": "Lectura 1 (Ragin, cap. 3), apartado «Introducción»: la última parte del capítulo se ocupa de las diferencias entre las tres estrategias usuales de investigación social (el estudio cualitativo de los aspectos comunes, el comparativo de la diversidad y el cuantitativo de la covariación) respecto de la interacción entre imágenes y marcos analíticos."}], "B": [{"id": "c1", "kind": "grid", "title": "Estrategia deductiva y estrategia inductiva", "slides": "Lámina 5", "intro": "Completa el cuadro: elige una pieza para cada casilla. Las piezas están agrupadas por columna.", "rows": [{"id": "pp", "label": "Punto de partida"}, {"id": "rd", "label": "Relación con los datos"}, {"id": "vf", "label": "Valoración de Flick"}], "cols": [{"id": "d", "label": "Deductiva"}, {"id": "i", "label": "Inductiva"}], "chips": [{"id": "pp.d", "t": "Modelos teóricos, de los que se derivan las preguntas de investigación y las hipótesis.", "home": "pp.d", "why": "Partir de modelos teóricos para derivar preguntas e hipótesis es lo propio de la estrategia deductiva."}, {"id": "pp.i", "t": "Conceptos sensibilizadores, que permiten enfocar los contextos sociales que deben estudiarse.", "home": "pp.i", "why": "Los conceptos sensibilizadores son el punto de partida de la estrategia inductiva."}, {"id": "rd.d", "t": "Las hipótesis se ponen a prueba frente a los datos empíricos.", "home": "rd.d", "why": "En la estrategia deductiva la teoría se pone a prueba frente a los datos."}, {"id": "rd.i", "t": "Las teorías se desarrollan a partir de estudios empíricos.", "home": "rd.i", "why": "En la estrategia inductiva la teoría se desarrolla a partir de estudios empíricos."}, {"id": "vf.d", "t": "En contextos nuevos, no logra diferenciar los objetos.", "home": "vf.d", "why": "Es la valoración de Flick sobre la estrategia deductiva en contextos nuevos."}, {"id": "vf.i", "t": "Cada vez más necesaria.", "home": "vf.i", "why": "Es la valoración de Flick sobre la estrategia inductiva."}]}, {"id": "c2", "kind": "grid", "title": "Tres soluciones ante la complejidad del objeto", "slides": "Lámina 10", "intro": "Completa el cuadro de la lámina: elige una pieza para cada casilla. Las piezas están agrupadas por columna.", "rows": [{"id": "s1", "label": "1.ª · Mencionada por Bortz"}, {"id": "s2", "label": "2.ª · Diseños cuantitativos complejos"}, {"id": "s3", "label": "3.ª · Investigación cualitativa"}], "cols": [{"id": "n", "label": "Cómo se resume"}, {"id": "h", "label": "Qué hace"}, {"id": "p", "label": "Qué se pierde o qué subsiste"}], "chips": [{"id": "s1.n", "t": "Excluye la complejidad.", "home": "s1.n", "why": "La solución mencionada por Bortz resuelve el problema dejando fuera los objetos complejos."}, {"id": "s2.n", "t": "Incorpora la complejidad.", "home": "s2.n", "why": "Los diseños cuantitativos complejos incorporan la complejidad dentro del modelo."}, {"id": "s3.n", "t": "Abre los métodos.", "home": "s3.n", "why": "La investigación cualitativa responde abriendo los métodos al objeto."}, {"id": "s1.h", "t": "Diseña los estudios solo según el modelo de relaciones claras de causa-efecto.", "home": "s1.h", "why": "Es lo que hace la solución de Bortz: limitarse al modelo de causa-efecto."}, {"id": "s2.h", "t": "Considera las condiciones contextuales (por ejemplo, análisis multinivel) y comprende los modelos empírica y estadísticamente.", "home": "s2.h", "why": "El análisis multinivel es el ejemplo de los diseños cuantitativos complejos."}, {"id": "s3.h", "t": "Diseña métodos tan abiertos que hagan justicia a la complejidad del objeto, estudiado en su totalidad y en su contexto cotidiano.", "home": "s3.h", "why": "Hacer justicia a la complejidad del objeto con métodos abiertos es la tercera solución."}, {"id": "s1.p", "t": "Se pierden los objetos complejos: habría que excluirlos todos.", "home": "s1.p", "why": "Si todos los estudios siguieran el modelo de causa-efecto, habría que excluir los objetos complejos."}, {"id": "s2.p", "t": "Subsiste el «problema básico»: solo se muestra lo que ya abarca el modelo subyacente de la realidad, y es más difícil reintroducir los hallazgos en lo cotidiano.", "home": "s2.p", "why": "El problema básico subsiste aunque el modelo incorpore la complejidad."}, {"id": "s3.p", "t": "En este pasaje el texto no señala pérdida ni problema subsistente.", "home": "s3.p", "why": "La lámina aclara que, para la solución cualitativa, el texto no señala pérdida ni problema subsistente."}]}, {"id": "c3", "kind": "grid", "title": "Síntesis: cuantitativa tradicional y cualitativa", "slides": "Lámina 20", "intro": "Completa el cuadro de síntesis: elige una pieza para cada casilla. Las piezas están agrupadas por columna.", "rows": [{"id": "pp", "label": "Punto de partida"}, {"id": "om", "label": "Objeto y método"}, {"id": "oe", "label": "Objeto de estudio"}, {"id": "ri", "label": "Rol del investigador"}, {"id": "me", "label": "Meta"}, {"id": "ca", "label": "Calidad"}], "cols": [{"id": "q", "label": "Cuantitativa tradicional"}, {"id": "c", "label": "Cualitativa (según Flick)"}], "chips": [{"id": "pp.q", "t": "Modelos teóricos e hipótesis a contrastar.", "home": "pp.q", "why": "Partir de modelos teóricos e hipótesis a contrastar es lo propio de la cuantitativa tradicional."}, {"id": "pp.c", "t": "Conceptos sensibilizadores; teorías desarrolladas a partir de estudios empíricos.", "home": "pp.c", "why": "La cualitativa parte de conceptos sensibilizadores y desarrolla teorías."}, {"id": "om.q", "t": "Se juzga el objeto según los métodos disponibles (Bortz).", "home": "om.q", "why": "Es el criterio de Bortz que Flick no comparte."}, {"id": "om.c", "t": "El objeto determina el método.", "home": "om.c", "why": "Para Flick, el objeto es el factor determinante para escoger el método."}, {"id": "oe.q", "t": "Causas y efectos aislados; fenómenos medidos.", "home": "oe.q", "why": "La cuantitativa tradicional aísla causas y efectos y mide los fenómenos."}, {"id": "oe.c", "t": "Objetos en su complejidad y totalidad, en su contexto cotidiano.", "home": "oe.c", "why": "La cualitativa estudia los objetos en su complejidad y su contexto cotidiano."}, {"id": "ri.q", "t": "Influencia excluida al máximo.", "home": "ri.q", "why": "La cuantitativa tradicional excluye lo más posible la influencia del investigador."}, {"id": "ri.c", "t": "Comunicación con el campo y subjetividades como parte del conocimiento.", "home": "ri.c", "why": "La cualitativa incorpora la comunicación con el campo y las subjetividades."}, {"id": "me.q", "t": "Generalizar hallazgos y formular leyes generales.", "home": "me.q", "why": "Generalizar y formular leyes es la meta de la cuantitativa tradicional."}, {"id": "me.c", "t": "Descubrir lo nuevo y desarrollar teorías fundamentadas empíricamente.", "home": "me.c", "why": "Descubrir lo nuevo y desarrollar teorías es la meta de la cualitativa."}, {"id": "ca.q", "t": "Criterios académicos abstractos; objetividad.", "home": "ca.q", "why": "La calidad se juzga por criterios académicos abstractos y objetividad."}, {"id": "ca.c", "t": "Fundamento empírico, adecuación del método al objeto, relevancia y poder de reflexión.", "home": "ca.c", "why": "Son los criterios de calidad de la investigación cualitativa según Flick."}]}], "D": [{"id": "d1", "title": "¿Estrategia deductiva o inductiva?", "slides": "Láminas 5 y 6", "opts": ["Deductiva", "Inductiva", "Ambas"], "intro": "Indica a qué estrategia corresponde cada descripción. Una de ellas se apoya en Ragin (Lectura 1).", "items": [{"q": "Parte de modelos teóricos de los que se derivan las preguntas de investigación y las hipótesis.", "ans": 0, "tip": "Es la estrategia deductiva: la teoría es el punto de partida y se pone a prueba frente a los datos empíricos.", "ref": "Lámina 5"}, {"q": "Usa conceptos sensibilizadores para enfocar los contextos sociales que deben estudiarse.", "ans": 1, "tip": "Es la estrategia inductiva: en lugar de partir de teorías para comprobarlas, los conceptos sensibilizadores orientan la mirada.", "ref": "Láminas 5 y 6"}, {"q": "Usa teoría; lo que cambia es el lugar que esta ocupa: se pone a prueba o se desarrolla.", "ans": 2, "tip": "Corresponde a ambas: la diferencia no está en que una use teoría y la otra no, sino en el lugar que la teoría ocupa. Incluso los conceptos sensibilizadores están influidos por conocimiento teórico previo.", "ref": "Láminas 5 y 6"}, {"q": "En contextos nuevos, no logra diferenciar los objetos, según la valoración de Flick.", "ans": 0, "tip": "Es la estrategia deductiva: Flick sostiene que derivar hipótesis de modelos teóricos y ponerlas a prueba no diferencia los objetos cuando los contextos son nuevos.", "ref": "Láminas 4 y 5"}, {"q": "Las teorías se desarrollan a partir de estudios empíricos.", "ans": 1, "tip": "Es la estrategia inductiva: la teoría no se comprueba, sino que se desarrolla a partir de los estudios empíricos.", "ref": "Láminas 5 y 6"}, {"q": "Ragin describe marcos analíticos fijos desde el comienzo, que ponen en práctica una hipótesis que se desea comprobar.", "ans": 0, "tip": "Ragin dice que los marcos fijos son muchas veces necesarios en estudios que pretenden comprobar la validez de las teorías. En este apartado habla de marcos fijos o fluidos, no de estrategia deductiva o inductiva: asimilar el marco fijo a la lógica deductiva es una comparación de este ejercicio.", "ref": "Lámina 5 · Ragin, cap. 3, «Procesos y estrategias de la investigación social»"}]}, {"id": "d2", "title": "¿Cuantitativa tradicional o cualitativa?", "slides": "Láminas 11 a 20", "opts": ["Cuantitativa tradicional", "Cualitativa (según Flick)"], "intro": "Indica a qué enfoque corresponde cada descripción, según la presentación y el texto de Flick.", "items": [{"q": "Muestra con qué frecuencia ocurre la esquizofrenia en cada clase social.", "ans": 0, "tip": "Es lo que muestran los estudios epidemiológicos del ejemplo (frecuencia y distribución en la población), que Flick contrasta con las preguntas cualitativas. Clasificarlo como cuantitativo es interpretación de este ejercicio.", "ref": "Láminas 11, 17 y 18"}, {"q": "Pregunta qué significa vivir con la enfermedad mental para el paciente y para sus familiares.", "ans": 1, "tip": "Es una pregunta cualitativa: busca el significado subjetivo y las perspectivas de las personas implicadas, que los estudios epidemiológicos dejan sin responder.", "ref": "Láminas 18 y 19"}, {"q": "Se eligen muestras aleatorias de la población para asegurar la representatividad.", "ans": 0, "tip": "Es un procedimiento de diseño del modelo cuantitativo tradicional.", "ref": "Lámina 11"}, {"q": "Las impresiones y los sentimientos de quien investiga se convierten en datos de propio derecho.", "ans": 1, "tip": "Es un rasgo de la investigación cualitativa: la reflexión del investigador forma parte de la interpretación y se documenta en diarios o protocolos de contexto.", "ref": "Láminas 14 y 15"}, {"q": "Los estudios se diseñan para excluir al máximo la influencia del investigador.", "ans": 0, "tip": "Es una de las garantías de objetividad del modelo cuantitativo tradicional.", "ref": "Lámina 11"}, {"q": "Diseña los métodos con apertura hacia sus objetos, para hacer justicia a la diversidad de la vida cotidiana.", "ans": 1, "tip": "Es el planteamiento cualitativo según Flick: el objeto determina el método, y no al revés.", "ref": "Lámina 13"}]}, {"id": "d3", "title": "¿Qué rasgo de la investigación cualitativa es?", "slides": "Láminas 8 a 19", "opts": ["Conveniencia de los métodos y las teorías", "Perspectivas de los participantes y su diversidad", "Capacidad de reflexión del investigador y la investigación", "Variedad de los enfoques y los métodos"], "intro": "Clasifica cada descripción según los cuatro rasgos de la lámina 8.", "items": [{"q": "El objeto en estudio es el factor determinante para escoger el método, y no al revés.", "ans": 0, "tip": "Es la conveniencia de los métodos y las teorías: la elección debe ser apropiada al objeto.", "ref": "Láminas 8 y 13 · Flick, «Conveniencia de los métodos y las teorías»"}, {"q": "Se muestra la variedad de perspectivas (paciente, familiares, profesionales) sobre un mismo fenómeno, la esquizofrenia.", "ans": 1, "tip": "Son las perspectivas de los participantes y su diversidad: el ejemplo de Flick muestra la variedad de perspectivas sobre el mismo objeto.", "ref": "Láminas 16 a 19 · Flick, «Perspectivas de los participantes y su diversidad»"}, {"q": "Los sentimientos y los accesos de irritación en el campo se registran en un diario de investigación.", "ans": 2, "tip": "Es la capacidad de reflexión del investigador y la investigación: sus reflexiones son datos de propio derecho y se documentan en diarios o protocolos de contexto.", "ref": "Láminas 14 y 15 · Flick, «Poder de reflexión del investigador y la investigación»"}, {"q": "No hay un concepto teórico y metodológico unificado: diversos enfoques teóricos y sus métodos caracterizan los debates y la práctica.", "ans": 3, "tip": "Es la variedad de los enfoques y los métodos en la investigación cualitativa.", "ref": "Lámina 8 (rasgo nombrado) · Flick, «Variedad de enfoques y métodos en la investigación cualitativa»"}, {"q": "Los puntos de vista y las prácticas en el campo son diferentes a causa de las distintas perspectivas subjetivas y de los ambientes sociales.", "ans": 1, "tip": "Son las perspectivas de los participantes y su diversidad: la investigación cualitativa toma en cuenta que los puntos de vista y las prácticas difieren según las perspectivas y los ambientes.", "ref": "Lámina 16 · Flick, «Perspectivas de los participantes y su diversidad»"}, {"q": "La comunicación del investigador con el campo se toma como una parte explícita de la producción de conocimiento.", "ans": 2, "tip": "Es la capacidad de reflexión del investigador y la investigación: a diferencia de lo cuantitativo, no se excluye esa comunicación como una variable.", "ref": "Láminas 14 y 15 · Flick, «Poder de reflexión del investigador y la investigación»"}]}], "Q": [{"id": "q1", "tag": "Explicar y relacionar", "title": "De la falta de familiaridad a la estrategia inductiva", "ask": "Explica por qué, según Flick, el cambio social y la diversificación de los mundos vitales llevan a usar estrategias inductivas, y qué lugar ocupa la teoría en la estrategia deductiva y en la inductiva.", "sources": "Presentación 2 (láminas 4 a 7) · Flick (Lectura 2) · Ragin, cap. 3 (Lectura 1)", "incl": ["La falta de familiaridad como punto de partida y los contextos nuevos (lámina 4).", "Por qué la deducción no logra diferenciar los objetos en contextos nuevos y qué la reemplaza.", "La diferencia de fondo entre ambas estrategias (el lugar que ocupa la teoría, lámina 5) y el papel de los conceptos sensibilizadores (lámina 6).", "Una conexión con Ragin (Lectura 1): marcos analíticos fijos o fluidos."], "concepts": ["falta de familiaridad", "contextos nuevos", "estrategia deductiva", "estrategia inductiva", "conceptos sensibilizadores", "marcos analíticos"], "length": "Una respuesta completa suele ocupar entre 12 y 18 líneas.", "starter": "Para Flick, el punto de partida de quien investiga lo social es…", "review": ["Presentación 2, láminas 4 a 7", "Flick: «Relevancia de la investigación cualitativa»", "Ragin, cap. 3: «Procesos y estrategias de la investigación social»"], "answers": [{"label": "Una forma posible", "text": ["Para Flick, el punto de partida de quien investiga lo social es, prácticamente siempre, no conocer lo que ocurre realmente en la esfera de vida estudiada (idea de Blumer que Flick recoge). El rápido cambio social y la diversificación de los mundos vitales enfrentan a quienes investigan con contextos y perspectivas tan nuevos que las metodologías deductivas tradicionales —derivar preguntas e hipótesis de modelos teóricos y ponerlas a prueba frente a datos empíricos— no logran diferenciar los objetos. Por eso la investigación se ve forzada, cada vez más, a usar estrategias inductivas.", "Ambas estrategias usan teoría; la diferencia está en el lugar que esta ocupa: en la deductiva se pone a prueba y en la inductiva se desarrolla a partir de estudios empíricos. La inductiva parte de conceptos sensibilizadores que orientan la mirada hacia los contextos sociales; contra un error extendido, estos conceptos no están libres de conocimiento teórico previo, aunque las teorías se desarrollan a partir de estudios empíricos. En la Lectura 1, Ragin señala que los marcos analíticos fijos son muchas veces necesarios en estudios que pretenden comprobar teorías, mientras que en otras investigaciones los marcos son flexibles o fluidos y cambian durante el estudio."]}]}, {"id": "q2", "tag": "Analizar un caso del texto", "title": "Lo que la epidemiología deja sin responder", "ask": "Analiza el ejemplo de los trastornos mentales de Flick: qué muestran los estudios epidemiológicos, qué dejan sin responder y cómo lo abordaría la investigación cualitativa. Relaciona el ejemplo con la objeción de Flick a Bortz o con lo que Ragin dice sobre las visiones panorámicas.", "sources": "Presentación 2 (láminas 9, 10 y 16 a 19) · Flick (Lectura 2) · Ragin, cap. 4 (Lectura 3)", "incl": ["Qué muestran los estudios epidemiológicos (frecuencia y distribución) y qué correlación hallaron.", "Las dos cosas que quedan sin responder: la dirección de la correlación y el significado y las perspectivas de las personas.", "Al menos tres de las cinco preguntas de la lámina 19 y qué hace con ellas la investigación cualitativa.", "Una relación con la objeción de Flick (láminas 9 y 10) o con lo que Ragin dice sobre las visiones panorámicas (Lectura 3)."], "concepts": ["correlación", "significado subjetivo", "perspectivas de los participantes", "complejidad del objeto", "visión panorámica"], "length": "Una respuesta completa suele ocupar entre 14 y 22 líneas.", "starter": "Los estudios epidemiológicos muestran… pero…", "review": ["Presentación 2, láminas 9, 10 y 16 a 19", "Flick: «Perspectivas de los participantes y su diversidad» y «Conveniencia de los métodos y las teorías»", "Ragin, cap. 4: «Introducción»"], "answers": [{"label": "Con la objeción de Flick", "text": ["Los estudios epidemiológicos muestran la frecuencia de la esquizofrenia en la población y cómo varía su distribución: Hollingshead y Redlich hallaron que los trastornos mentales graves son mucho más frecuentes en las clases sociales bajas que en las altas, y la correlación se confirmó repetidamente. Sin embargo, no pudo clarificarse su dirección (si las condiciones de vida de una clase baja promueven los trastornos o si las personas con problemas mentales caen hacia las clases bajas), y los hallazgos no dicen nada sobre lo que significa vivir con la enfermedad, su significado subjetivo ni la diversidad de perspectivas de las personas implicadas.", "La investigación cualitativa se concentra en preguntas como el significado subjetivo de la esquizofrenia para el paciente y para sus familiares, cómo hacen frente a la enfermedad las personas implicadas, qué originó su comienzo y qué la hizo crónica, la influencia de las instituciones y las ideas, metas y rutinas que guían la terapia. Así muestra la variedad de perspectivas (paciente, familiares, profesionales), estudia el conocimiento y las prácticas de los participantes y explica las interrelaciones en el contexto concreto del caso. Una forma de relacionarlo con la objeción de Flick (conexión que propone este ejercicio, no el texto): los fenómenos no se explican aislados por la complejidad de la realidad, y la tercera solución de la lámina 10 abre los métodos al objeto en lugar de excluir los objetos complejos."]}, {"label": "Con Ragin (visión panorámica)", "text": ["Los estudios epidemiológicos muestran la frecuencia de la esquizofrenia en la población y cómo varía su distribución: Hollingshead y Redlich hallaron que los trastornos mentales graves son mucho más frecuentes en las clases sociales bajas que en las altas, y la correlación se confirmó repetidamente. Sin embargo, no pudo clarificarse su dirección (si las condiciones de vida de una clase baja promueven los trastornos o si las personas con problemas mentales caen hacia las clases bajas), y los hallazgos no dicen nada sobre lo que significa vivir con la enfermedad, su significado subjetivo ni la diversidad de perspectivas de las personas implicadas.", "Ragin señala que una visión panorámica resume en un porcentaje o una estadística la información de muchos casos, pero no dice nada acerca de los casos individuales, y que a muchos investigadores cualitativos no les gustan esas visiones amplias porque creen que una comprensión adecuada se consigue solo con un examen en profundidad de casos específicos. El ejemplo de Flick ilustra algo parecido: la correlación muestra un patrón general, pero para saber qué significa vivir con la enfermedad hay que estudiar en profundidad a las personas implicadas, que es lo que hacen las preguntas de la lámina 19."]}]}, {"id": "q3", "tag": "Comparar y justificar", "title": "Cuantitativa tradicional y cualitativa según Flick", "ask": "Compara la investigación cuantitativa tradicional y la cualitativa según Flick en al menos cuatro aspectos de la lámina 20, y justifica con el ejemplo de los trastornos mentales por qué, para Flick, el método debe elegirse según el objeto y no al revés; relaciónalo con una idea de Ragin sobre cómo la forma de investigar modela la representación de la vida social.", "sources": "Presentación 2 (láminas 9, 10, 13, 17 a 20) · Flick (Lectura 2) · Ragin, cap. 3 (Lectura 1)", "incl": ["Al menos cuatro aspectos de la síntesis (punto de partida, objeto y método, objeto de estudio, rol del investigador, meta, calidad).", "Por qué Flick sostiene que el objeto determina el método y qué no comparte del criterio de Bortz.", "Una ilustración con el ejemplo de los trastornos mentales.", "Una conexión con Ragin (Lectura 1): la forma de investigar modela la representación (por ejemplo, la de los soldados)."], "concepts": ["el objeto determina el método", "criterio de Bortz", "complejidad del objeto", "rol del investigador", "calidad"], "length": "Una respuesta completa suele ocupar entre 16 y 24 líneas.", "starter": "Según la síntesis de Flick, la investigación cuantitativa tradicional…", "review": ["Presentación 2, láminas 9, 10, 13 y 17 a 20", "Flick: «Límites de la investigación cuantitativa como punto de partida» y «Conveniencia de los métodos y las teorías»", "Ragin, cap. 3: «Introducción»"], "answers": [{"label": "Una forma posible", "text": ["Según la síntesis de la lámina 20, la investigación cuantitativa tradicional parte de modelos teóricos e hipótesis a contrastar, mientras que la cualitativa parte de conceptos sensibilizadores y desarrolla teorías a partir de estudios empíricos. La primera juzga el objeto según los métodos disponibles (Bortz) y la segunda sostiene que el objeto determina el método; la primera estudia causas y efectos aislados y la segunda, objetos en su complejidad y su contexto cotidiano; la primera excluye al máximo la influencia del investigador y la segunda incorpora la comunicación con el campo y las subjetividades como parte del conocimiento. También difieren en la meta (generalizar y formular leyes frente a descubrir lo nuevo y desarrollar teorías fundamentadas) y en la calidad (criterios académicos abstractos y objetividad frente a fundamento empírico, adecuación del método al objeto, relevancia y poder de reflexión).", "Flick no comparte el criterio de Bortz de juzgar el objeto según los métodos disponibles (lámina 9). Además, la primera solución que menciona Bortz implicaría que, si todos los estudios se diseñaran solo según el modelo de relaciones claras de causa-efecto, habría que excluir los objetos complejos (lámina 10). En el ejemplo de los trastornos mentales, la correlación entre clase social y esquizofrenia no aclara su dirección ni lo que significa vivir con la enfermedad; una forma de relacionarlo con la tercera solución es que se requiere un método abierto al objeto, que pregunte por los significados y las perspectivas de pacientes, familiares y profesionales. Ragin ofrece una idea relacionada en la Lectura 1: un investigador que vive con un grupo pequeño de soldados y otro que encuesta a muchos con una muestra aleatoria construyen representaciones muy diferentes de lo que significa ser soldado, porque el diálogo entre ideas y pruebas empíricas es distinto en cada caso; es decir, la forma de investigar modela la representación de la vida social."]}]}], "minw": 40};
